# Two sites, one per front end. Both forward the API to the gateway on the same host.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 3000;
    root /usr/share/nginx/admin;
    index index.html;
    client_max_body_size 50m;            # CSV imports

    location /api/    { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; proxy_read_timeout 300s; }
    location /health  { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; }
    location /ws      { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; proxy_read_timeout 3600s; }
    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
    # Every screen has its own URL (/<module>/<section>); unknown paths fall back to the app.
    location /        { try_files $uri /index.html; }
}

server {
    listen 3001;
    root /usr/share/nginx/portal;
    index index.html;
    client_max_body_size 50m;

    location /api/    { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; proxy_read_timeout 300s; }
    location /health  { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; }
    location /ws      { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; proxy_read_timeout 3600s; }
    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
    location /        { try_files $uri /index.html; }
}
