# Three sites, one per front end. All forward the API to the gateway on the same host.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# The nginx image ships with gzip off, which would send the 1 MB data-grid script and the charts uncompressed. API answers are already compressed by the gateway (nginx leaves
# those alone); this is for the files nginx serves itself. Hashed files under /assets are compressed once per request and cached by the browser for a week.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml;

server {
    listen 3000;
    root /usr/share/nginx/admin;
    index index.html;
    client_max_body_size 50m;            # CSV imports

    location /api/    { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; proxy_read_timeout 300s; }
    location /scim/   { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; }
    location /health  { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; }
    location /ws      { proxy_pass http://127.0.0.1:4000; include /etc/nginx/proxy.inc; proxy_read_timeout 3600s; }
    location /assets/ { expires 7d; add_header Cache-Control "public, immutable"; }
    # Every screen has its own URL (/<module>/<section>); unknown paths fall back to the app.
    location /        { add_header Cache-Control "no-cache"; try_files $uri /index.html; }   # index.html names the hashed files, so it must always be checked
}

